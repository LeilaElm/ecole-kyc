<script>
/* =====================================================================
   CONTENU PÉDAGOGIQUE — École KYC / LCB-FT
   Pour ajouter du contenu : compléter les objets "days" (lesson, exercise, quiz)
   de la semaine voulue, puis "weekQuiz". Une leçon à null = « Contenu à venir ».
   Format d'une question : { q, options:[...], answer:index, explain }
   Règle : aucun lien, aucun article de loi, aucun chiffre réglementaire inventé.
   Les détails incertains sont signalés par <span class="verify">…</span>.
   ===================================================================== */
const COURSE = { weeks: [] };

COURSE.weeks.push({
  id: 1,
  title: "Les bases de la LCB-FT",
  goal: "Comprendre ce que sont le blanchiment et le financement du terrorisme, qui fait quoi, et les mots que tu entendras tous les jours.",
  deliverable: { key: "s1_vocab", label: "Fiche de vocabulaire" },
  days: [
/* ---------------------------------------------------------------- J1 */
{
  id: "1-1",
  title: "Le blanchiment : placement, empilement, intégration",
  minutes: 12,
  lesson: `
<h2>Pourquoi ce métier existe</h2>
<p>Une personne qui gagne de l'argent de manière illégale (trafic, fraude, corruption, escroquerie…) se heurte vite à un problème : elle ne peut pas dépenser cet argent librement sans attirer l'attention. Acheter un appartement ou une voiture avec un sac de billets, cela se remarque. Elle a donc besoin de <strong>donner une apparence légale</strong> à cet argent. C'est exactement cela, <strong>blanchir</strong> de l'argent : faire en sorte que de l'« argent sale » ressemble à de l'« argent propre ».</p>
<p>Le rôle de l'analyste KYC / LCB-FT est d'empêcher que la banque (ou l'assurance, la société de paiement…) serve d'outil à ce blanchiment. Tu ne fais pas une enquête de police : tu <strong>connais ton client</strong>, tu vérifies que ce qu'il fait est <strong>cohérent</strong> avec ce qu'il dit, et tu <strong>signales</strong> ce qui ne l'est pas.</p>
<div class="callout"><p><strong>Le lien avec ton métier d'assistante sociale :</strong> tu as l'habitude de reconstituer une situation à partir de pièces (avis d'imposition, bulletins de salaire, attestations), de repérer ce qui ne colle pas et de l'écrire de façon neutre. C'est le cœur du travail KYC.</p></div>

<h2>Les trois étapes classiques</h2>
<p>On décrit traditionnellement le blanchiment en trois étapes. Dans la réalité elles se chevauchent, mais ce modèle est très utile pour raisonner.</p>

<h3>1. Le placement (ou « prélavage »)</h3>
<p>C'est le moment où l'argent illégal <strong>entre dans le système financier</strong>. C'est l'étape la plus risquée pour le blanchisseur, car l'argent est encore proche de son origine (souvent des espèces).</p>
<ul>
<li>Dépôts d'espèces sur un compte, parfois fractionnés en petits montants répétés pour ne pas attirer l'attention (on parle de <em>fractionnement</em> ou, en anglais, de <em>smurfing</em>).</li>
<li>Achat de biens de valeur payés en espèces (bijoux, montres, véhicules) pour les revendre ensuite.</li>
<li>Mélange de l'argent illégal avec la recette d'un commerce qui manipule beaucoup d'espèces (restaurant, laverie, commerce de proximité).</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> M. A., sans emploi déclaré, dépose plusieurs fois par semaine des espèces sur son compte, toujours dans des agences différentes, en petits montants. Pris un par un, chaque dépôt semble anodin. C'est la <strong>répétition</strong> et l'<strong>incohérence avec sa situation</strong> qui doivent alerter.</p></div>

<h3>2. L'empilement (ou « dispersion », <em>layering</em>)</h3>
<p>Une fois l'argent dans le système, le blanchisseur multiplie les opérations pour <strong>brouiller la piste</strong> et rendre l'origine des fonds difficile à retrouver.</p>
<ul>
<li>Virements successifs entre plusieurs comptes, dans plusieurs banques, parfois dans plusieurs pays.</li>
<li>Utilisation de sociétés « écrans » (des sociétés qui existent sur le papier mais n'ont pas de vraie activité).</li>
<li>Fausses factures entre sociétés pour justifier des transferts.</li>
<li>Achat puis revente rapide de produits financiers, ou passage par des crypto-actifs.</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> la société « Alpha Négoce » reçoit un virement, le renvoie le lendemain vers une société d'un autre pays, qui le renvoie vers une troisième… Chaque opération est accompagnée d'une facture de « conseil » très vague. Le but : qu'on ne sache plus d'où vient l'argent.</p></div>

<h3>3. L'intégration</h3>
<p>L'argent, désormais « blanchi », <strong>revient dans l'économie légale</strong> avec une apparence de légitimité. Le blanchisseur peut l'utiliser.</p>
<ul>
<li>Achat immobilier, investissement dans une entreprise, achat d'objets de luxe.</li>
<li>Versement de faux salaires ou de faux dividendes.</li>
<li>Remboursement anticipé d'un prêt avec des fonds dont l'origine n'est pas expliquée.</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> Mme B. achète un appartement en présentant des fonds venant d'une « société de conseil » dont elle est la seule associée, sans activité visible. Sur le papier, c'est son revenu ; en réalité, c'est la fin du circuit de blanchiment.</p></div>

<h2>Ce qu'il faut retenir pour le poste</h2>
<table><thead><tr><th>Étape</th><th>Question que tu te poses</th></tr></thead><tbody>
<tr><td>Placement</td><td>D'où viennent ces espèces ? Est-ce cohérent avec le métier et les revenus du client ?</td></tr>
<tr><td>Empilement</td><td>Pourquoi tant d'opérations, de comptes, de pays ? Y a-t-il une logique économique ?</td></tr>
<tr><td>Intégration</td><td>Ce patrimoine ou cet achat est-il cohérent avec l'histoire financière du client ?</td></tr>
</tbody></table>
<p>Le mot clé du métier est <strong>cohérence</strong>. Un montant élevé n'est pas suspect en soi ; un montant incohérent avec le profil du client, si.</p>

<h2>L'infraction d'origine</h2>
<p>On appelle <strong>infraction d'origine</strong> (ou infraction sous-jacente) le délit ou le crime qui a produit l'argent : trafic de stupéfiants, fraude fiscale, corruption, escroquerie, travail dissimulé… En France, le blanchiment est défini de façon large : il peut concerner le produit de très nombreux crimes et délits.</p>
<span class="verify">la définition juridique exacte du blanchiment et la liste des infractions concernées figurent dans le Code pénal et le Code monétaire et financier ; je ne cite volontairement aucun article ici.</span>
<p>Bonne nouvelle : l'analyste n'a pas à <strong>prouver</strong> l'infraction d'origine. Son rôle est de repérer les <strong>signaux</strong> et de faire remonter un <strong>soupçon</strong> (nous verrons cela au jour 5).</p>
`,
  exercise: {
    prompt: `<p>Pour chaque situation fictive, indique l'étape (placement, empilement ou intégration) et explique en une phrase pourquoi :</p>
<ol>
<li>Un client verse régulièrement des espèces sur le compte de son épicerie, bien au-delà de ce que son petit commerce semble pouvoir encaisser.</li>
<li>Une société transfère des fonds vers trois sociétés dans trois pays différents en une semaine, avec des factures de « prestations diverses ».</li>
<li>Un client achète une maison avec des « dividendes » d'une société qui n'a ni salarié ni site internet.</li>
</ol>
<p>Puis rédige tes trois premières définitions pour ta <strong>fiche de vocabulaire</strong> : placement, empilement, intégration.</p>`,
    placeholder: "1. … parce que …\n2. …\n3. …\n\nPlacement : …\nEmpilement : …\nIntégration : …",
    deliverable: "s1_vocab",
    correction: `<p><strong>Correction type :</strong> 1 = <strong>placement</strong> (des espèces entrent dans le système en se mêlant à une recette commerciale). 2 = <strong>empilement</strong> (multiplication des transferts et des pays pour brouiller la piste, factures vagues). 3 = <strong>intégration</strong> (l'argent revient dans l'économie légale sous forme d'achat immobilier, justifié par une société sans activité visible).</p>`
  },
  quiz: [
    { q: "Que signifie « blanchir » de l'argent ?", options: ["Placer son argent sur un livret d'épargne", "Donner une apparence légale à de l'argent d'origine illégale", "Retirer de l'argent en espèces", "Échanger des euros contre une devise étrangère"], answer: 1, explain: "Blanchir, c'est faire passer de l'argent issu d'une activité illégale pour de l'argent légal, afin de pouvoir l'utiliser sans attirer l'attention." },

  lesson: `
<h2>Une logique inversée</h2>
<p>Le blanchiment part d'argent <strong>sale</strong> pour le rendre propre. Le financement du terrorisme fonctionne souvent à l'envers : de l'argent qui peut être parfaitement <strong>propre</strong> (salaire, aide sociale, don, petit commerce, prêt à la consommation) est utilisé pour une finalité <strong>criminelle</strong> : soutenir une personne ou un groupe qui prépare ou commet des actes terroristes.</p>
<div class="callout"><p><strong>À retenir :</strong> pour le blanchiment, on regarde surtout <strong>d'où vient</strong> l'argent. Pour le financement du terrorisme, on regarde surtout <strong>où il va</strong> et <strong>à quoi il sert</strong>.</p></div>

<h2>Des montants souvent faibles</h2>
<p>Contrairement à l'image du « gros trafic », le financement du terrorisme peut porter sur des <strong>sommes modestes</strong> : achat de billets de transport, de matériel, location d'un véhicule, envoi régulier de petits montants à l'étranger. C'est ce qui le rend difficile à repérer : il n'y a pas forcément de montant spectaculaire.</p>
<p>L'analyse repose donc sur le <strong>contexte</strong> et les <strong>signaux faibles</strong> plutôt que sur la taille des opérations.</p>

<h2>Les principales sources de financement (concepts généraux)</h2>
<ul>
<li><strong>Autofinancement</strong> : revenus personnels, épargne, crédits à la consommation contractés puis jamais remboursés.</li>
<li><strong>Collecte de fonds</strong> : appels aux dons, parfois sous couvert d'associations humanitaires ou de cagnottes en ligne.</li>
<li><strong>Activités criminelles</strong> : petits trafics, fraudes, escroqueries.</li>
<li><strong>Soutien de réseaux</strong> à l'étranger, via des transferts d'argent.</li>
</ul>

<h2>Exemples de signaux d'alerte (fictifs et génériques)</h2>
<ul>
<li>Un client souscrit plusieurs crédits à la consommation en peu de temps, retire les fonds en espèces, puis le compte devient inactif.</li>
<li>Des transferts répétés de petits montants vers une zone de conflit, sans lien familial ou professionnel expliqué.</li>
<li>Une association dont les flux ne correspondent pas à l'objet déclaré (beaucoup d'espèces, transferts vers des bénéficiaires sans lien avec l'activité).</li>
<li>Une vente rapide de tous ses biens et la clôture de ses comptes, avant un départ à l'étranger, de façon incohérente avec la situation connue.</li>
<li>Un nom correspondant à une personne inscrite sur une <strong>liste de sanctions</strong> ou de gel des avoirs (nous verrons cela en semaine 3).</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> Mme C., étudiante, reçoit une bourse et un petit salaire. En un mois, elle obtient trois crédits renouvelables, retire tout en espèces et envoie plusieurs petits virements via un service de transfert d'argent vers un pays tiers. Chaque opération est faible, mais l'ensemble est incohérent avec son profil : l'analyste documente et fait remonter.</p></div>

<div class="callout warn"><p><strong>Attention aux préjugés :</strong> une nationalité, une religion, un prénom ou un pays d'origine ne sont <strong>jamais</strong> à eux seuls un motif de soupçon. Un soupçon repose sur des <strong>faits</strong> et des <strong>opérations</strong> incohérentes. Ta rigueur d'assistante sociale (neutralité, non-jugement) est ici un vrai atout.</p></div>

<h2>LCB-FT : un seul dispositif</h2>
<p>En France, on parle de <strong>LCB-FT</strong> : Lutte Contre le Blanchiment de capitaux et le Financement du Terrorisme. Les deux sujets sont traités par le <strong>même dispositif</strong> : connaissance du client, surveillance des opérations, déclaration de soupçon, respect des mesures de gel des avoirs. En anglais, tu croiseras les sigles <strong>AML</strong> (<em>Anti-Money Laundering</em>) et <strong>CFT</strong> (<em>Countering the Financing of Terrorism</em>), souvent réunis en <strong>AML/CFT</strong>.</p>
<span class="verify">les obligations précises (contenu, délais, modalités) applicables au financement du terrorisme et au gel des avoirs sont fixées par les textes et les lignes directrices ; elles seront approfondies en semaine 3.</span>

  title: "Les acteurs : GAFI, Tracfin, ACPR, AMF",

<h2>Qui fait quoi ? Une vue d'ensemble</h2>
<p>La LCB-FT repose sur plusieurs niveaux d'acteurs. Un bon repère : du plus international au plus proche de toi.</p>
<table><thead><tr><th>Niveau</th><th>Acteur</th><th>Rôle en une phrase</th></tr></thead><tbody>
<tr><td>International</td><td>GAFI</td><td>Fixe les standards et évalue les pays.</td></tr>
<tr><td>Europe</td><td>Union européenne</td><td>Adopte des règles communes (directives, règlements) et des mesures restrictives (sanctions).</td></tr>
<tr><td>France</td><td>Tracfin</td><td>Reçoit et analyse les déclarations de soupçon.</td></tr>
<tr><td>France</td><td>ACPR</td><td>Contrôle les banques et assurances, y compris leur dispositif LCB-FT.</td></tr>
<tr><td>France</td><td>AMF</td><td>Contrôle certains acteurs des marchés financiers.</td></tr>
<tr><td>Terrain</td><td>Les « assujettis »</td><td>Banques, assurances, notaires… appliquent les obligations au quotidien. C'est là que tu travailleras.</td></tr>
</tbody></table>

<h2>Le GAFI (Groupe d'action financière)</h2>
<p>En anglais <strong>FATF</strong> (<em>Financial Action Task Force</em>). C'est un organisme <strong>intergouvernemental</strong> qui :</p>
<ul>
<li>rédige des <strong>recommandations</strong> : les standards internationaux de la LCB-FT, que les pays transposent dans leur droit ;</li>
<li>organise des <strong>évaluations</strong> des pays (on parle d'évaluations mutuelles) ;</li>
<li>publie des listes de <strong>juridictions à haut risque</strong> ou <strong>sous surveillance renforcée</strong> (souvent appelées « liste noire » et « liste grise »).</li>
</ul>
<p>Le GAFI n'est pas un tribunal et ne sanctionne pas directement les banques : il influence les règles des pays.</p>
<span class="verify">le nombre de recommandations du GAFI, leur numérotation et la composition actuelle des listes changent ou doivent être cités précisément : consulte toujours la version officielle en vigueur.</span>

<h2>Tracfin</h2>
<p><strong>Tracfin</strong> est la <strong>cellule de renseignement financier</strong> (CRF) française. C'est un service rattaché aux ministères économiques et financiers. Son rôle :</p>
<ul>
<li><strong>recevoir</strong> les déclarations de soupçon envoyées par les professionnels (banques, assurances, notaires, etc.) ;</li>
<li><strong>analyser</strong> ces informations et les enrichir ;</li>
<li>transmettre, lorsque c'est justifié, à l'autorité judiciaire ou à d'autres administrations ;</li>
<li><strong>sensibiliser</strong> les professionnels (guides, brochures — voir la page Ressources).</li>
</ul>
<div class="callout"><p>Concrètement : quand ta banque estime qu'une opération est suspecte, c'est à Tracfin qu'elle adresse sa déclaration. Tracfin est un service de <strong>renseignement</strong>, pas un tribunal.</p></div>

<h2>L'ACPR (Autorité de contrôle prudentiel et de résolution)</h2>
<p>L'ACPR est adossée à la <strong>Banque de France</strong>. Elle supervise notamment les <strong>banques</strong> et les <strong>assurances</strong>. Pour la LCB-FT, elle :</p>
<ul>
<li><strong>contrôle</strong> que les établissements ont un dispositif efficace (procédures, outils, formation, contrôles) ;</li>
<li>publie des <strong>lignes directrices</strong>, dont certaines conjointes avec Tracfin, qui expliquent comment appliquer les obligations (voir Ressources) ;</li>
<li>peut <strong>sanctionner</strong> un établissement dont le dispositif est défaillant, via sa commission des sanctions.</li>
</ul>
<div class="callout ex"><p><strong>Pourquoi c'est important pour toi :</strong> les dossiers que tu documentes peuvent être relus lors d'un contrôle. Une note claire, datée, sourcée protège ton établissement… et toi.</p></div>

<h2>L'AMF (Autorité des marchés financiers)</h2>
<p>L'AMF veille au bon fonctionnement des <strong>marchés financiers</strong> et à la protection de l'épargne investie. En LCB-FT, elle est compétente pour certains acteurs qu'elle agrée ou enregistre, par exemple des sociétés de gestion de portefeuille.</p>
<span class="verify">la répartition exacte des compétences entre ACPR et AMF selon le type d'établissement (et les catégories d'acteurs, par exemple dans le domaine des crypto-actifs) doit être confirmée dans les textes en vigueur.</span>

<h2>Les assujettis : ceux qui appliquent</h2>
<p>On appelle <strong>assujettis</strong> (ou « entités assujetties ») les professionnels soumis aux obligations LCB-FT. On y trouve notamment les banques, les établissements de paiement, les assurances, mais aussi d'autres professions comme les notaires, les agents immobiliers ou les experts-comptables. Chacun doit connaître ses clients, surveiller les opérations et déclarer ses soupçons.</p>
<span class="verify">la liste complète et à jour des professions assujetties est fixée par le Code monétaire et financier.</span>
<p>Dans une banque, tu travailleras typiquement au sein de la <strong>conformité</strong> (ou « compliance »), dans une équipe KYC, de surveillance des opérations, ou de traitement des alertes.</p>
`,

{
  id: "1-4",
  title: "Notions clés : KYC, bénéficiaire effectif, PPE",
  minutes: 14,
  lesson: `
<h2>Le KYC : « Know Your Customer »</h2>
<p><strong>KYC</strong> signifie « connais ton client ». C'est l'ensemble des démarches qui permettent à un établissement de savoir <strong>qui est son client</strong>, <strong>ce qu'il fait</strong> et <strong>pourquoi</strong> il utilise ses services. En français, on parle d'obligations de <strong>vigilance</strong> à l'égard de la clientèle.</p>
<p>Le KYC se déroule en deux temps :</p>
<ol>
<li><strong>À l'entrée en relation</strong> (ouverture de compte) : identifier le client et vérifier son identité, comprendre l'objet et la nature de la relation (pourquoi ouvre-t-il ce compte ? pour quel usage ?), évaluer son niveau de risque.</li>
<li><strong>Pendant toute la relation</strong> (vigilance constante) : mettre à jour les informations, vérifier que les opérations restent cohérentes avec ce que l'on sait du client.</li>
</ol>
<div class="callout"><p><strong>Analogie avec ton métier :</strong> c'est comme l'évaluation sociale initiale puis le suivi du dossier. On ne connaît pas quelqu'un une fois pour toutes : la situation évolue, le dossier doit suivre.</p></div>

<h3>Identifier et vérifier : deux actions différentes</h3>
<ul>
<li><strong>Identifier</strong> : recueillir les informations (nom, prénoms, date et lieu de naissance, adresse, activité…).</li>
<li><strong>Vérifier</strong> : s'assurer que ces informations sont exactes, à l'aide de documents fiables (pièce d'identité en cours de validité, par exemple).</li>
</ul>
<span class="verify">la liste précise des informations et des documents exigés, ainsi que les modalités de vérification à distance, sont définies par la réglementation et les lignes directrices ; nous les verrons en semaine 2.</span>

<h3>L'approche par les risques</h3>
<p>Tous les clients ne présentent pas le même risque. L'établissement adapte donc l'intensité de ses contrôles : vigilance <strong>simplifiée</strong>, <strong>standard</strong> ou <strong>renforcée</strong>. C'est ce qu'on appelle l'<strong>approche par les risques</strong>. Les facteurs pris en compte touchent au client, au produit, au canal de distribution (en agence ou à distance) et aux pays concernés.</p>

<h2>Le bénéficiaire effectif</h2>
<p>Quand le client est une <strong>société</strong> (ou une association, une fiducie…), il faut savoir quelle(s) <strong>personne(s) physique(s)</strong> se trouve(nt) réellement derrière. C'est le <strong>bénéficiaire effectif</strong> : la ou les personnes physiques qui, <strong>in fine</strong>, possèdent ou contrôlent l'entité.</p>
<ul>
<li>Il peut s'agir des personnes qui détiennent une part importante du capital ou des droits de vote, directement ou à travers d'autres sociétés.</li>
<li>Ou de celles qui exercent un <strong>contrôle</strong> par d'autres moyens (pouvoir de décision, accords).</li>
<li>À défaut, la réglementation prévoit de retenir le ou les dirigeants (représentant légal).</li>
</ul>
<span class="verify">le seuil de détention retenu pour qualifier un bénéficiaire effectif et les règles de repli sur le dirigeant sont fixés par les textes : ne retiens aucun chiffre sans l'avoir vérifié.</span>
<div class="callout ex"><p><strong>Exemple fictif :</strong> la SAS « Delta Services » est détenue par la société « Holding Omega », elle-même détenue par M. E. et Mme F. Le client est Delta Services, mais les bénéficiaires effectifs à rechercher sont des <strong>personnes physiques</strong> : M. E. et/ou Mme F., selon leur part et leur contrôle. Il faut « remonter la chaîne » jusqu'aux humains.</p></div>
<p>Pourquoi est-ce si important ? Parce que les sociétés écrans servent justement à <strong>cacher</strong> qui contrôle l'argent. En France, il existe un <strong>registre des bénéficiaires effectifs</strong> des sociétés.</p>
<span class="verify">les conditions d'accès au registre des bénéficiaires effectifs ont évolué ces dernières années ; vérifie les règles actuelles avant de t'y référer.</span>

<h2>Les PPE : personnes politiquement exposées</h2>
<p>Une <strong>PPE</strong> est une personne qui exerce ou a exercé une <strong>fonction publique importante</strong> (par exemple : chef d'État, membre d'un gouvernement, parlementaire, haut magistrat, dirigeant d'une entreprise publique, ambassadeur…). Sont aussi concernés ses <strong>membres de famille</strong> proches et les personnes qui lui sont <strong>étroitement associées</strong>.</p>
<p>Être PPE n'est <strong>pas</strong> un délit ni un motif de refus ! Mais ces personnes présentent un risque plus élevé de <strong>corruption</strong>. L'établissement applique donc des mesures de <strong>vigilance renforcée</strong>, par exemple :</p>
<ul>
<li>décision d'entrer en relation prise à un niveau hiérarchique plus élevé ;</li>
<li>recherche de l'<strong>origine du patrimoine et des fonds</strong> ;</li>
<li>surveillance renforcée des opérations pendant la relation.</li>
</ul>
<span class="verify">la liste exacte des fonctions qui font d'une personne une PPE, la définition des proches et la durée pendant laquelle une personne reste considérée comme PPE après la fin de ses fonctions sont fixées par les textes.</span>
<div class="callout ex"><p><strong>Exemple fictif :</strong> M. G., ancien ministre d'un pays étranger, souhaite ouvrir un compte et y verser le produit de la vente d'une villa. Ce n'est pas suspect en soi : l'analyste demande l'acte de vente, vérifie la cohérence avec son parcours et transmet le dossier pour validation au niveau prévu par la procédure.</p></div>

<h2>Récapitulatif</h2>
<table><thead><tr><th>Notion</th><th>En une phrase</th></tr></thead><tbody>
<tr><td>KYC</td><td>Savoir qui est le client, ce qu'il fait et pourquoi, au début et tout au long de la relation.</td></tr>
<tr><td>Approche par les risques</td><td>Adapter l'intensité des contrôles au niveau de risque.</td></tr>

<h2>Qu'est-ce qu'une déclaration de soupçon ?</h2>
<p>La <strong>déclaration de soupçon</strong> (souvent abrégée <strong>DS</strong>) est le document par lequel un professionnel assujetti informe <strong>Tracfin</strong> qu'il <strong>sait, soupçonne ou a de bonnes raisons de soupçonner</strong> que des sommes ou des opérations pourraient provenir d'une infraction ou être liées au financement du terrorisme.</p>
<div class="callout"><p><strong>Le point essentiel :</strong> on déclare un <strong>soupçon</strong>, pas une certitude. L'établissement n'a pas à prouver l'infraction. C'est ensuite à Tracfin d'analyser.</p></div>
<span class="verify">la formulation légale exacte de l'obligation déclarative, son champ précis et le moment où la déclaration doit être faite (en principe avant l'exécution de l'opération, avec des exceptions) sont définis par le Code monétaire et financier.</span>

<h2>Le circuit dans une banque (schéma général)</h2>
<ol>
<li><strong>Détection</strong> : un conseiller, un outil de surveillance ou un analyste repère une anomalie (alerte).</li>
<li><strong>Analyse</strong> : l'analyste collecte les éléments (historique, pièces, explications du client), vérifie la cohérence et rédige une <strong>note</strong> factuelle.</li>
<li><strong>Décision</strong> : la conformité décide de classer l'alerte (explication satisfaisante) ou de déclarer.</li>
<li><strong>Déclaration</strong> : elle est transmise à Tracfin par les personnes habilitées de l'établissement (souvent appelées déclarant et correspondant Tracfin).</li>
<li><strong>Suivi</strong> : la relation fait l'objet d'une vigilance adaptée ; l'établissement peut aussi décider d'y mettre fin selon sa politique.</li>
</ol>
<p>En tant qu'analyste junior, tu interviens surtout aux étapes 1 et 2 : ta <strong>note d'analyse</strong> est la base de la décision.</p>

<h2>La confidentialité : ne jamais prévenir le client</h2>
<p>L'existence d'une déclaration de soupçon est <strong>confidentielle</strong>. Il est interdit d'en informer le client ou des tiers. En anglais, on parle d'interdiction du <em>tipping-off</em>.</p>
<div class="callout warn"><p>Concrètement : tu peux poser des questions au client pour comprendre une opération (« quelle est l'origine de ces fonds ? »), mais tu ne lui dis <strong>jamais</strong> qu'une déclaration est envisagée ou a été faite. Tes notes internes restent internes.</p></div>
<span class="verify">les exceptions prévues (partage d'informations au sein d'un groupe, entre certains professionnels) sont encadrées précisément par les textes.</span>

<h2>Ce qu'on trouve dans une bonne analyse</h2>
<p>Ton expérience de rédaction de notes sociales est directement transférable. Une note d'analyse LCB-FT efficace est :</p>
<ul>
<li><strong>Factuelle</strong> : des dates, des montants, des opérations, des pièces. Pas de jugement sur la personne.</li>
<li><strong>Structurée</strong> : contexte client → faits observés → éléments recueillis → incohérences → conclusion / proposition.</li>
<li><strong>Sourcée</strong> : chaque information a une origine (pièce, outil, échange avec le client, source ouverte).</li>
<li><strong>Courte</strong> : un relecteur doit comprendre en une minute.</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif de conclusion :</strong> « Le client, salarié déclarant un revenu mensuel modeste, a déposé des espèces à plusieurs reprises sur une courte période, pour un total sans rapport avec ses revenus connus. Interrogé, il évoque des “gains de jeux” sans justificatif. L'origine des fonds n'étant pas établie, je propose la transmission du dossier au déclarant pour analyse. »</p></div>

<h2>Déclaration de soupçon ≠ refus ≠ fermeture</h2>
<ul>
<li>Déclarer n'oblige pas forcément à fermer le compte, et fermer le compte ne dispense pas de déclarer si le soupçon existe.</li>
<li>Si l'établissement <strong>ne parvient pas à identifier</strong> le client ou à obtenir les informations nécessaires, il ne doit pas entrer en relation (ou doit y mettre fin), et apprécier s'il y a lieu de déclarer.</li>
</ul>

{
  id: "2-1",
  title: "Vigilance simplifiée, standard, renforcée",
  minutes: 12,
  lesson: `
<h2>Rappel : l'approche par les risques</h2>
<p>En semaine 1, tu as vu que tous les clients ne présentent pas le même risque. L'établissement n'applique donc pas les mêmes contrôles à tout le monde : il <strong>proportionne</strong> sa vigilance. C'est un peu comme en service social : on ne mobilise pas les mêmes moyens pour une demande d'information simple et pour une situation de danger.</p>
<p>Concrètement, chaque client reçoit un <strong>niveau de risque</strong> (souvent faible, moyen ou élevé, selon la méthode de chaque établissement), qui détermine le <strong>niveau de vigilance</strong> : simplifiée, standard ou renforcée.</p>

<h2>D'où vient le niveau de risque ?</h2>
<p>Chaque établissement doit établir sa propre <strong>classification des risques</strong> (on parle aussi de « cartographie des risques »). On y croise généralement quatre familles de facteurs :</p>
<table><thead><tr><th>Facteur</th><th>Exemples de questions</th></tr></thead><tbody>
<tr><td><strong>Client</strong></td><td>Particulier ou société ? Activité ? PPE ? Structure de détention complexe ?</td></tr>
<tr><td><strong>Produit / service</strong></td><td>Compte courant simple, ou produit permettant des flux importants, anonymes ou internationaux ?</td></tr>
<tr><td><strong>Canal</strong></td><td>Entrée en relation en agence (face-à-face) ou entièrement à distance ? Via un intermédiaire ?</td></tr>
<tr><td><strong>Géographie</strong></td><td>Le client, ses fonds ou ses contreparties sont-ils liés à des pays à risque ?</td></tr>
</tbody></table>
<p>Dans beaucoup de banques, un <strong>outil de scoring</strong> calcule automatiquement un premier niveau de risque à partir des réponses du questionnaire d'ouverture. L'analyste vérifie, corrige si besoin, et motive.</p>

<h2>La vigilance standard : le cas général</h2>
<p>C'est le niveau « par défaut ». L'établissement :</p>
<ul>
<li><strong>identifie</strong> le client et <strong>vérifie</strong> son identité ;</li>
<li>identifie le cas échéant le <strong>bénéficiaire effectif</strong> ;</li>
<li>recueille les informations sur l'<strong>objet et la nature</strong> de la relation (pourquoi ce compte, pour quel usage, quels revenus attendus) ;</li>
<li>exerce une <strong>vigilance constante</strong> pendant la relation et <strong>met à jour</strong> le dossier.</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> M. L., cuisinier salarié, résidant en France, ouvre un compte en agence pour y domicilier son salaire. Pièces conformes, flux attendus cohérents : vigilance standard.</p></div>

<h2>La vigilance simplifiée : quand le risque est faible</h2>
<p>Lorsque le risque est <strong>identifié comme faible</strong>, l'établissement peut alléger certaines mesures (par exemple leur intensité ou la fréquence des mises à jour). Attention à trois idées fausses :</p>
<ul>
<li>« Simplifiée » ne veut <strong>pas</strong> dire « aucune vigilance » : le client reste identifié et la relation surveillée.</li>
<li>Elle repose sur une <strong>analyse</strong> du risque, pas sur une impression (« ce client a l'air sympathique »).</li>
<li>Elle <strong>cesse</strong> dès qu'un soupçon apparaît ou que le risque n'est plus faible.</li>
</ul>
<span class="verify">les situations, clients et produits pouvant bénéficier de mesures simplifiées, et les mesures précises qui peuvent être allégées, sont définis par le Code monétaire et financier et précisés par les lignes directrices.</span>

<h2>La vigilance renforcée : quand le risque est élevé</h2>
<p>Certaines situations imposent ou justifient des mesures <strong>plus poussées</strong>. Exemples classiques :</p>
<ul>
<li>le client (ou son bénéficiaire effectif) est une <strong>PPE</strong> ;</li>
<li>la relation ou l'opération implique un <strong>pays tiers à haut risque</strong> (notamment au regard des listes du GAFI et de l'Union européenne) ;</li>
<li>une opération est <strong>inhabituellement complexe</strong> ou <strong>d'un montant inhabituellement élevé</strong>, ou ne semble pas avoir de <strong>justification économique</strong> ou d'objet licite apparent ;</li>
<li>le classement de risque de l'établissement place le client en risque élevé (structure opaque, activité sensible, etc.).</li>
</ul>
<p>Les mesures renforcées prennent par exemple la forme de :</p>
<ul>
<li>justificatifs supplémentaires sur l'<strong>origine des fonds</strong> et du <strong>patrimoine</strong> (voir jour 4) ;</li>
<li>validation de la relation par un <strong>niveau hiérarchique</strong> plus élevé ;</li>
<li><strong>surveillance accrue</strong> des opérations et mises à jour plus fréquentes du dossier.</li>
</ul>
<p>Pour une opération inhabituelle, on parle souvent d'<strong>examen renforcé</strong> : on se renseigne sur l'origine et la destination des fonds, sur l'objet de l'opération et sur l'identité de la contrepartie, et on <strong>consigne</strong> les résultats.</p>
<span class="verify">la liste exacte des cas de vigilance renforcée obligatoire, le contenu de l'examen renforcé et les mesures spécifiques applicables aux pays tiers à haut risque sont fixés par les textes et précisés par les lignes directrices ACPR / Tracfin.</span>

<div class="callout warn"><p><strong>Vigilance renforcée ≠ soupçon.</strong> Un client en vigilance renforcée n'est pas suspect : il présente des facteurs de risque. Inversement, un client « faible risque » peut faire l'objet d'une déclaration de soupçon si ses opérations le justifient.</p></div>

<h2>Le niveau de risque bouge</h2>
<p>Le niveau de vigilance n'est pas gravé dans le marbre. Un client peut passer de standard à renforcé (il devient PPE, il commence à recevoir des virements d'un pays à risque…) ou l'inverse. C'est pourquoi la <strong>mise à jour du dossier</strong> (souvent appelée « revue KYC » ou « revue périodique ») est une grande partie du travail quotidien d'un analyste.</p>
<span class="verify">la fréquence des revues périodiques selon le niveau de risque est fixée par chaque établissement dans ses procédures, dans le cadre des textes.</span>

<h2>À retenir</h2>
<table><thead><tr><th>Niveau</th><th>Quand ?</th><th>En pratique</th></tr></thead><tbody>
<tr><td>Simplifiée</td><td>Risque identifié comme faible</td><td>Mesures allégées, mais client identifié et suivi</td></tr>
<tr><td>Standard</td><td>Cas général</td><td>Identification, vérification, objet de la relation, vigilance constante</td></tr>
<tr><td>Renforcée</td><td>Risque élevé (PPE, pays à haut risque, opérations inhabituelles…)</td><td>Justificatifs supplémentaires, validation hiérarchique, surveillance accrue</td></tr>
</tbody></table>
`,

<li><strong>Renforcée</strong> : membre de la famille d'une PPE (facteur client) et fonds importants dont il faut documenter l'origine (acte de cession de l'entreprise). Validation hiérarchique selon la procédure.</li>

<li>Le client reste globalement en vigilance standard, mais cette <strong>opération inhabituelle</strong> justifie un <strong>examen renforcé</strong> : origine des fonds, objet, contrepartie, puis réévaluation du niveau de risque.</li></ol>`
  },
  quiz: [
    { q: "Quel est le niveau de vigilance « par défaut » ?", options: ["Simplifiée", "Standard", "Renforcée", "Aucune"], answer: 1, explain: "La vigilance standard est le cas général : identification, vérification, objet de la relation, vigilance constante." },
    { q: "La vigilance simplifiée signifie :", options: ["Qu'on ne vérifie plus rien", "Que certaines mesures sont allégées lorsque le risque est identifié comme faible", "Que le client est une PPE", "Qu'on ouvre le compte sans pièce d'identité"], answer: 1, explain: "Simplifiée ne veut pas dire absente : elle repose sur un risque faible identifié et cesse dès qu'un soupçon apparaît." },
    { q: "Lequel de ces éléments justifie typiquement une vigilance renforcée ?", options: ["Un client salarié en CDI", "Un lien avec un pays tiers à haut risque", "Un compte ouvert en agence", "Un paiement de loyer par virement"], answer: 1, explain: "L'implication d'un pays tiers à haut risque fait partie des situations classiques de vigilance renforcée, comme les PPE ou les opérations inhabituelles." },
    { q: "Quelles sont les quatre familles de facteurs de risque généralement croisées ?", options: ["Âge, sexe, nationalité, religion", "Client, produit/service, canal, géographie", "Montant, devise, date, heure", "Agence, conseiller, guichet, carte"], answer: 1, explain: "On combine le profil du client, le produit utilisé, le canal d'entrée en relation et les pays concernés. Jamais de critères discriminatoires." },

{
  id: "2-2",
  title: "Pièces d'identité et justificatif de domicile",
  minutes: 13,
  lesson: `
<h2>Identifier, puis vérifier</h2>
<p>Pour un client <strong>personne physique</strong>, l'établissement recueille les éléments d'identification (nom, prénoms, date et lieu de naissance…) puis les <strong>vérifie</strong> sur un document probant. Tu as l'habitude de ce réflexe : en service social, tu ne te contentes pas de ce que la personne déclare, tu regardes les pièces.</p>

<h2>La pièce d'identité</h2>
<p>On demande en principe un <strong>document officiel en cours de validité comportant une photographie</strong> : par exemple carte nationale d'identité, passeport, ou titre de séjour pour une personne étrangère.</p>
<span class="verify">la liste des documents acceptés, les informations à relever et les modalités de vérification (notamment en cas d'entrée en relation à distance : identification électronique, second document, premier virement depuis un compte à son nom…) sont fixées par les textes et précisées par les lignes directrices ; chaque établissement les décline dans sa procédure.</span>

<h3>La check-list de contrôle d'une pièce d'identité</h3>
<ol>
<li><strong>Validité</strong> : le document est-il en cours de validité ? La date de délivrance précède-t-elle bien la date d'expiration ?</li>
<li><strong>Photo</strong> : correspond-elle à la personne (en agence) ou au selfie / à la vidéo (à distance) ? L'âge apparent est-il cohérent avec la date de naissance ?</li>
<li><strong>Cohérence des données</strong> : nom, prénoms, date de naissance identiques au formulaire et aux autres pièces ?</li>
<li><strong>Zone MRZ</strong> : sur beaucoup de documents (passeports, cartes récentes), les lignes de caractères en bas du document, appelées <strong>MRZ</strong> (<em>Machine Readable Zone</em>, zone de lecture automatique), reprennent les données principales. Elles doivent correspondre aux données visibles.</li>
<li><strong>Aspect général</strong> : traces de grattage, de collage, photo qui « flotte », typographie irrégulière, couleurs anormales.</li>
<li><strong>Copie complète</strong> : recto et verso, lisible, non coupée.</li>
</ol>
<div class="callout ex"><p><strong>Exemple fictif :</strong> sur le passeport de M. P., la date de naissance visible est le 12 mars, mais la MRZ indique une autre date. Ce n'est pas forcément une fraude (cela peut être une erreur de saisie dans le formulaire ou une mauvaise copie), mais c'est une <strong>incohérence à lever</strong> avant toute validation.</p></div>
<p>De nombreuses banques utilisent des <strong>outils de vérification automatique</strong> (lecture de la MRZ, contrôle des éléments de sécurité, comparaison du visage). Ils aident, mais l'analyste reste responsable de l'analyse finale et des cas que l'outil signale.</p>

<h2>Le justificatif de domicile</h2>
<p>Il permet de confirmer l'<strong>adresse déclarée</strong>. On rencontre couramment : facture d'énergie, d'eau, de téléphone ou d'internet, avis d'imposition, quittance de loyer, attestation d'assurance habitation… On vérifie que le document est <strong>récent</strong>, au <strong>nom du client</strong>, et que l'adresse est <strong>identique</strong> à celle déclarée.</p>
<span class="verify">l'exigence d'un justificatif de domicile, son ancienneté maximale acceptée et la liste des documents admis relèvent pour une large part des procédures internes de chaque établissement : ne retiens pas de délai chiffré sans l'avoir vérifié.</span>

<h3>Les situations particulières (que tu connais bien)</h3>
<ul>
<li><strong>Personne hébergée</strong> : souvent, attestation d'hébergement de l'hébergeant, avec sa pièce d'identité et son propre justificatif de domicile.</li>
<li><strong>Personne sans domicile stable</strong> : une <strong>domiciliation administrative</strong> (par exemple auprès d'un CCAS ou d'un organisme agréé) peut servir d'adresse.</li>
<li><strong>Refus d'ouverture de compte</strong> : en France, il existe une procédure de <strong>droit au compte</strong> qui passe par la Banque de France.</li>
</ul>
<span class="verify">les conditions précises de la domiciliation administrative et de la procédure de droit au compte sont définies par les textes ; vérifie-les avant de t'y référer.</span>
<div class="callout"><p><strong>Ton atout :</strong> tu sais qu'une situation atypique (hébergement, domiciliation, titre de séjour en renouvellement avec récépissé) n'est pas une fraude. Tu sauras demander la bonne pièce plutôt que de refuser par réflexe, tout en restant rigoureuse.</p></div>

<h2>Recouper les pièces entre elles</h2>
<p>Le contrôle le plus efficace est souvent le <strong>croisement</strong> :</p>
<ul>
<li>Le nom est-il orthographié de la même façon partout ?</li>
<li>L'adresse de la facture est-elle celle de l'avis d'imposition et des bulletins de salaire ?</li>
<li>La profession déclarée est-elle cohérente avec les revenus et l'employeur indiqués ?</li>
<li>Le numéro de téléphone ou l'adresse e-mail sont-ils déjà utilisés par d'autres clients sans lien apparent ?</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> Mme Q. fournit une facture d'électricité à une adresse à Lyon, mais ses bulletins de salaire, récents, indiquent une adresse à Lille. Explication possible : déménagement récent. Action : demander un justificatif complémentaire, et noter l'explication au dossier.</p></div>

<h2>Que faire en cas de doute ?</h2>
<ol>
<li><strong>Ne pas valider</strong> en l'état.</li>
<li><strong>Demander</strong> un complément de façon neutre (« pouvez-vous nous transmettre… »), sans accuser.</li>
<li><strong>Documenter</strong> ce qui a été constaté et demandé.</li>
<li>Si les indices de falsification sont sérieux, <strong>escalader</strong> selon la procédure (nous verrons cela au jour 5).</li>
</ol>
`,

    prompt: `<p>Dossier fictif d'ouverture de compte à distance — M. Rémi FICTIF :</p>
<ul>
<li>Formulaire : né le 04/07, domicilié 12 rue des Lilas à Nantes, technicien.</li>
<li>Carte d'identité : nom « Rémy FICTIF » ; date de naissance identique ; carte en cours de validité ; verso non transmis.</li>
<li>Justificatif de domicile : facture internet au nom de Mme S. FICTIF, 12 rue des Lilas, Nantes.</li>
<li>Selfie : ressemblance correcte.</li>
</ul>
<p>Liste les points conformes, les points à lever, et rédige le message neutre que tu enverrais au client pour compléter le dossier.</p>`,
    placeholder: "Conforme : …\nÀ lever : …\nMessage au client : …",
    deliverable: null,
    correction: `<p><strong>Correction type :</strong> conformes = validité de la carte, date de naissance concordante, selfie ressemblant, adresse identique. À lever = orthographe du prénom différente (Rémi / Rémy) ; verso de la carte manquant ; justificatif au nom d'une autre personne (Mme S. FICTIF), donc probablement une situation d'hébergement ou de foyer à documenter. Message : « Bonjour, afin de finaliser l'ouverture de votre compte, merci de nous transmettre le verso de votre carte d'identité et un justificatif de domicile à votre nom, ou à défaut une attestation d'hébergement accompagnée de la pièce d'identité et du justificatif de domicile de la personne qui vous héberge. Merci de nous confirmer également l'orthographe exacte de votre prénom. » Décision : <strong>compléter</strong>.</p>`
  },
  quiz: [
    { q: "Quel type de document est en principe demandé pour vérifier l'identité d'un particulier ?", options: ["Une facture d'électricité", "Un document officiel en cours de validité avec photographie", "Une carte de fidélité", "Un relevé bancaire"], answer: 1, explain: "On vérifie l'identité sur un document officiel avec photo (CNI, passeport, titre de séjour…), selon la procédure de l'établissement." },
    { q: "Qu'est-ce que la MRZ ?", options: ["Un numéro de compte", "La zone de lecture automatique d'un document d'identité, qui reprend ses données principales", "Un fichier de la Banque de France", "Un type de justificatif de domicile"], answer: 1, explain: "La MRZ (Machine Readable Zone) reprend les données du document ; elle doit concorder avec les données visibles." },
    { q: "Le justificatif de domicile sert à :", options: ["Remplacer la pièce d'identité", "Confirmer l'adresse déclarée", "Prouver les revenus", "Vérifier la nationalité"], answer: 1, explain: "Il confirme l'adresse ; il ne remplace jamais la vérification d'identité." },
    { q: "Une cliente hébergée chez sa sœur fournit une facture au nom de celle-ci. Que fais-tu ?", options: ["Refus immédiat pour fraude", "Je demande une attestation d'hébergement avec les pièces de l'hébergeante, selon la procédure", "Je valide sans rien demander", "Je fais une déclaration de soupçon"], answer: 1, explain: "L'hébergement est une situation courante : on demande les pièces adaptées plutôt que de conclure à une fraude." },

{
  id: "2-3",
  title: "Personnes morales : statuts, Kbis, bénéficiaires effectifs",
  minutes: 14,
  lesson: `
<h2>Un client qui n'est pas une personne</h2>
<p>Une <strong>personne morale</strong> est une entité juridique : société (SARL, SAS, SA…), association, fondation, etc. Elle peut ouvrir un compte, mais ne peut pas se présenter au guichet : ce sont des <strong>personnes physiques</strong> qui agissent pour elle. Le KYC d'une personne morale répond donc à quatre questions :</p>
<ol>
<li>L'entité <strong>existe-t-elle</strong> vraiment, et que fait-elle ?</li>
<li><strong>Qui la représente</strong> et a le pouvoir d'agir pour elle ?</li>
<li><strong>Qui la possède ou la contrôle</strong> réellement (bénéficiaires effectifs) ?</li>
<li>Son <strong>activité</strong> et ses flux sont-ils cohérents ?</li>
</ol>

<h2>L'extrait Kbis : la « carte d'identité » de la société</h2>
<p>Pour une société commerciale immatriculée en France, l'<strong>extrait Kbis</strong> est l'extrait d'immatriculation au <strong>registre du commerce et des sociétés (RCS)</strong>. Il atteste de l'existence de la société et indique notamment :</p>
<ul>
<li>la <strong>dénomination</strong> et la <strong>forme juridique</strong> ;</li>
<li>l'adresse du <strong>siège</strong> ;</li>
<li>le <strong>numéro d'immatriculation</strong> ;</li>
<li>l'<strong>activité</strong> déclarée ;</li>
<li>les <strong>dirigeants</strong> (gérant, président…) ;</li>
<li>le <strong>capital</strong> et la date d'immatriculation.</li>
</ul>
<p>Points de contrôle : le Kbis est <strong>récent</strong>, il mentionne bien la société cliente, il ne fait pas état d'une radiation ou d'une procédure collective, et les dirigeants indiqués correspondent à ceux qui se présentent.</p>
<span class="verify">l'ancienneté maximale acceptée pour un extrait Kbis et les documents équivalents pour les entités non immatriculées au RCS ou étrangères sont fixés par les textes et les procédures internes.</span>

<h2>Les statuts : les règles du jeu</h2>
<p>Les <strong>statuts</strong> sont le « contrat » fondateur de la société. On y lit :</p>
<ul>
<li>l'<strong>objet social</strong> (ce que la société a le droit de faire) ;</li>
<li>la répartition du <strong>capital</strong> entre les associés (au moins à la création) ;</li>
<li>les règles de <strong>fonctionnement</strong> et les <strong>pouvoirs</strong> des dirigeants.</li>
</ul>
<p>On vérifie qu'ils sont <strong>signés</strong>, <strong>à jour</strong> (dernière version) et <strong>cohérents</strong> avec le Kbis. Attention : la répartition du capital a pu changer depuis la création ; il peut falloir des documents complémentaires (procès-verbal d'assemblée, registre des mouvements de titres, tableau de détention signé…).</p>
<div class="callout ex"><p><strong>Exemple fictif :</strong> l'objet social de la SARL « Lumière Déco » est la vente de luminaires. Sur le compte, on voit surtout des achats et ventes de véhicules d'occasion. Ce n'est pas forcément illégal (l'activité a pu évoluer), mais c'est une <strong>incohérence à expliquer</strong>.</p></div>

<h2>Le représentant légal et les pouvoirs</h2>
<p>Il faut identifier et vérifier l'identité de la personne qui ouvre le compte pour la société, et s'assurer qu'elle en a le <strong>pouvoir</strong> : soit elle est dirigeante (mentionnée au Kbis), soit elle dispose d'une <strong>délégation de pouvoir</strong> signée par un dirigeant.</p>

<h2>Le bénéficiaire effectif : remonter jusqu'aux humains</h2>
<p>Tu l'as vu en semaine 1 : le bénéficiaire effectif est la ou les <strong>personnes physiques</strong> qui, in fine, détiennent ou contrôlent l'entité. La méthode pratique :</p>
<ol>
<li>Lister les associés directs (statuts, tableau de détention).</li>
<li>Pour chaque associé qui est une <strong>société</strong>, recommencer : qui détient cette société ?</li>
<li>Continuer jusqu'à n'avoir que des personnes physiques.</li>
<li>Calculer la détention <strong>indirecte</strong> de chacune et regarder qui exerce un <strong>contrôle</strong> (droits de vote, pouvoir de nommer les dirigeants, accords).</li>
<li>Si personne n'est identifié selon ces critères, appliquer la règle de repli (dirigeant).</li>
</ol>
<span class="verify">le seuil de détention ou de droits de vote qui qualifie un bénéficiaire effectif, les autres critères de contrôle et la règle de repli sont fixés par les textes : vérifie-les avant tout calcul.</span>
<div class="callout ex"><p><strong>Exemple fictif :</strong> la SAS « Vega » est détenue à parts égales par M. T. (personne physique) et par la société « Nova Holding ». Nova Holding est détenue entièrement par Mme U. Il faut donc identifier <strong>M. T. et Mme U.</strong>, puis vérifier leur part et leur contrôle effectifs au regard des critères réglementaires.</p></div>

<h3>Le registre des bénéficiaires effectifs</h3>
<p>Les sociétés doivent déclarer leurs bénéficiaires effectifs à un <strong>registre</strong>. L'analyste compare souvent les informations du registre avec celles fournies par le client. Une <strong>divergence</strong> doit être creusée.</p>
<span class="verify">les modalités d'accès au registre des bénéficiaires effectifs et l'éventuelle obligation de signaler les divergences constatées ont évolué : vérifie les règles en vigueur.</span>

<h2>Les associations</h2>
<p>Pour une association, on regarde généralement les <strong>statuts</strong>, la preuve de sa <strong>déclaration</strong> (par exemple récépissé de déclaration en préfecture ou publication officielle), la liste des <strong>dirigeants</strong> et la décision désignant les personnes habilitées à faire fonctionner le compte. On vérifie surtout la <strong>cohérence des flux avec l'objet</strong> déclaré (rappel du jour 2 de la semaine 1).</p>
<span class="verify">les pièces exigées pour les associations et les autres entités (fondations, fiducies, entités étrangères) varient selon leur nature : se reporter aux textes et aux procédures.</span>

<h2>Les signaux d'alerte sur une personne morale</h2>
<ul>
<li>Chaîne de détention <strong>longue ou opaque</strong>, avec des sociétés dans plusieurs pays, sans raison économique claire.</li>
<li>Refus ou difficulté à communiquer les <strong>bénéficiaires effectifs</strong>.</li>
<li>Société <strong>récente</strong> annonçant des flux très importants sans salariés ni locaux (simple domiciliation).</li>
<li>Changements <strong>fréquents</strong> de dirigeants, de siège ou d'objet social.</li>
<li>Activité réelle <strong>sans rapport</strong> avec l'objet social.</li>
<li>Dirigeant « de paille » (prête-nom) : personne qui semble n'avoir ni l'expérience ni le contrôle réel.</li>
</ul>
`,
  exercise: {
    prompt: `<p>Dossier fictif : la SAS « Kappa Distribution » ouvre un compte professionnel.</p>
<ul>
<li>Kbis récent : président = M. V. ; activité = commerce de gros de fruits et légumes.</li>
<li>Statuts : associés = M. V. (minoritaire) et la société « Sigma Ltd » (majoritaire), immatriculée à l'étranger.</li>
<li>Aucune information sur les actionnaires de Sigma Ltd.</li>
<li>La personne qui se présente en agence est Mme W., « responsable administrative », sans document de pouvoir.</li>
</ul>
<p>1) Quels contrôles sont satisfaits ? 2) Quelles pièces manquent ? 3) Qui sont les bénéficiaires effectifs à ce stade ?</p>`,
    placeholder: "1. Satisfaits : …\n2. Pièces manquantes : …\n3. Bénéficiaires effectifs : …",
    deliverable: null,
    correction: `<p><strong>Correction type :</strong> 1) Existence de la société (Kbis récent), activité déclarée, dirigeant identifié, statuts fournis. 2) <strong>Délégation de pouvoir</strong> signée du président au profit de Mme W. (et vérification de son identité), ou présence de M. V. ; documents sur <strong>Sigma Ltd</strong> (équivalent du Kbis, actionnariat) ; identification des personnes physiques derrière Sigma Ltd ; éventuellement extrait du registre des bénéficiaires effectifs. 3) À ce stade, les bénéficiaires effectifs <strong>ne sont pas identifiés</strong> : M. V. est un candidat selon sa part et son contrôle réels, mais la majorité passe par Sigma Ltd, dont il faut remonter la chaîne. Décision : <strong>compléter</strong> avant toute ouverture.</p>`
  },
  quiz: [
    { q: "Qu'atteste un extrait Kbis ?", options: ["Les revenus du dirigeant", "L'existence légale d'une société immatriculée au RCS et ses informations principales", "Le patrimoine des associés", "L'absence de risque"], answer: 1, explain: "Le Kbis est l'extrait d'immatriculation au registre du commerce et des sociétés : dénomination, forme, siège, activité, dirigeants, capital…" },
    { q: "Dans les statuts, l'« objet social » désigne :", options: ["Le logo de la société", "L'activité que la société a pour but d'exercer", "Le compte bancaire de la société", "Le nom du comptable"], answer: 1, explain: "L'objet social décrit l'activité prévue. Des flux sans rapport avec cet objet sont une incohérence à expliquer." },
    { q: "Une personne se présente pour ouvrir le compte d'une société sans être dirigeante. Que faut-il vérifier ?", options: ["Rien de particulier", "Qu'elle dispose d'une délégation de pouvoir valable et vérifier son identité", "Son salaire", "Sa nationalité uniquement"], answer: 1, explain: "Seule une personne habilitée (dirigeant ou délégataire) peut engager la société. On vérifie aussi son identité." },
    { q: "Une société est détenue majoritairement par une holding. Le bénéficiaire effectif est :", options: ["La holding", "Les personnes physiques qui détiennent ou contrôlent la holding (et donc la société), selon les critères réglementaires", "Le banquier", "Le gérant de l'agence"], answer: 1, explain: "On remonte la chaîne de détention jusqu'aux personnes physiques." },
    { q: "Lequel est un signal d'alerte pour une personne morale ?", options: ["Un Kbis récent et conforme", "Une chaîne de détention opaque dans plusieurs pays sans raison économique claire", "Des statuts signés", "Un objet social clair"], answer: 1, explain: "Les structures opaques servent souvent à masquer les véritables propriétaires." }
  ]
},

{
  id: "2-4",
  title: "Origine des fonds et du patrimoine, cohérence économique",
  minutes: 13,
  lesson: `
<h2>Deux notions à ne pas confondre</h2>
<table><thead><tr><th>Notion</th><th>La question</th><th>Exemple</th></tr></thead><tbody>
<tr><td><strong>Origine des fonds</strong></td><td>D'où vient <strong>cet argent-là</strong>, pour <strong>cette opération</strong> ?</td><td>Le virement reçu hier provient de la vente d'une voiture.</td></tr>
<tr><td><strong>Origine du patrimoine</strong></td><td>Comment le client a-t-il constitué <strong>l'ensemble de ses biens</strong> ?</td><td>Une carrière de cadre, un héritage, la vente d'une entreprise.</td></tr>
</tbody></table>
<p>L'origine des fonds est demandée dès qu'une opération le justifie. L'origine du patrimoine est surtout examinée en <strong>vigilance renforcée</strong> (PPE, clients fortunés à risque…).</p>

<h2>Le cœur du métier : la cohérence économique</h2>
<p>La question centrale n'est pas « est-ce beaucoup d'argent ? » mais « <strong>est-ce cohérent</strong> avec ce que je sais du client ? ». On compare :</p>
<ul>
<li>ce que le client a <strong>déclaré</strong> (profession, revenus, patrimoine, objet du compte) ;</li>
<li>ce que les <strong>pièces</strong> montrent ;</li>
<li>ce que le compte <strong>fait réellement</strong> (montants, fréquence, contreparties, pays).</li>
</ul>
<div class="callout"><p><strong>Analogie :</strong> c'est l'évaluation budgétaire que tu fais avec une famille. Si les dépenses dépassent durablement les ressources déclarées, il y a une explication à trouver.</p></div>

<h2>Les justificatifs courants</h2>
<table><thead><tr><th>Origine invoquée</th><th>Justificatifs typiques</th></tr></thead><tbody>
<tr><td>Salaire, primes</td><td>Bulletins de salaire, contrat de travail, avis d'imposition</td></tr>
<tr><td>Activité indépendante</td><td>Bilans, déclarations de revenus, attestation de l'expert-comptable</td></tr>
<tr><td>Vente immobilière</td><td>Acte de vente notarié, attestation du notaire</td></tr>
<tr><td>Héritage</td><td>Document notarial relatif à la succession (attestation du notaire, acte de notoriété, déclaration de succession)</td></tr>
<tr><td>Donation</td><td>Acte de donation, déclaration de don</td></tr>
<tr><td>Prêt</td><td>Contrat de prêt, tableau d'amortissement</td></tr>
<tr><td>Vente d'un bien (véhicule, objet)</td><td>Facture, certificat de cession, preuve de propriété antérieure</td></tr>
<tr><td>Gains de jeux</td><td>Attestation de l'opérateur de jeux</td></tr>

<h2>Évaluer un justificatif</h2>
<p>Un justificatif n'est utile que s'il est :</p>
<ul>
<li><strong>pertinent</strong> : il concerne bien l'opération (dates, montants, noms) ;</li>
<li><strong>fiable</strong> : il émane d'un tiers indépendant (notaire, employeur, administration) plutôt que du client lui-même ;</li>
<li><strong>cohérent</strong> : les montants correspondent, la chronologie tient.</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> Mme X. justifie un virement entrant par la vente de sa maison. L'acte notarié indique un prix de vente cohérent, une date antérieure au virement, et le virement vient bien du compte de l'étude notariale. ✅ Justification satisfaisante.</p></div>
<div class="callout ex"><p><strong>Exemple fictif :</strong> M. Y. justifie un dépôt par « un prêt d'un ami » et fournit une reconnaissance de dette manuscrite, non datée, sans identité du prêteur. ⚠️ Justificatif peu fiable : on demande l'identité du prêteur, la preuve du transfert (relevé du compte du prêteur) et on reste attentif à la suite.</p></div>

<h2>Le cas particulier des espèces</h2>
<p>Les espèces ne laissent pas de trace de leur origine. Un dépôt d'espèces important ou répété, chez un client dont l'activité n'en génère pas, est un signal classique. On demande :</p>
<ul>
<li>d'où viennent les espèces, et depuis quand elles étaient détenues ;</li>
<li>pourquoi elles n'ont pas été déposées plus tôt ;</li>
<li>tout document qui corrobore (retraits antérieurs, vente, attestation).</li>
</ul>
<span class="verify">les règles spécifiques aux espèces (plafonds de paiement, obligations déclaratives particulières, communications systématiques) reposent sur des seuils fixés par les textes ; je ne les cite pas ici.</span>

<h2>Quand la justification ne suffit pas</h2>
<ol>
<li>Relancer le client avec une demande <strong>précise</strong> (quel document, pour quelle opération).</li>
<li>Noter au dossier les explications et leur <strong>évolution</strong> (une explication qui change à chaque relance est un signal).</li>
<li>Si l'origine reste <strong>non établie</strong> ou incohérente : proposer l'<strong>escalade</strong> au déclarant / à la conformité.</li>
</ol>
<div class="callout warn"><p>On ne dit jamais au client « sinon nous ferons une déclaration ». On explique simplement que l'établissement a besoin de ces éléments pour traiter l'opération.</p></div>

<h2>Les grandes familles de fraude documentaire</h2>
<table><thead><tr><th>Type</th><th>Ce que c'est</th></tr></thead><tbody>
<tr><td><strong>Contrefaçon</strong> (faux total)</td><td>Document entièrement fabriqué qui imite un vrai.</td></tr>
<tr><td><strong>Falsification</strong></td><td>Document authentique dont une partie a été modifiée (nom, date, photo, montant).</td></tr>
<tr><td><strong>Document volé ou obtenu indûment</strong></td><td>Vrai document, vierge ou appartenant à quelqu'un d'autre.</td></tr>
<tr><td><strong>Usurpation d'identité</strong></td><td>Utilisation des vrais documents d'une autre personne (souvent avec une ressemblance physique ou un selfie truqué).</td></tr>
<tr><td><strong>Faux justificatif</strong></td><td>Fausse facture, faux bulletin de salaire, faux avis d'imposition, fabriqués ou retouchés.</td></tr>
</tbody></table>
<p>Avec les outils numériques, les justificatifs « maison » (factures, bulletins, relevés en PDF) sont devenus faciles à modifier. C'est souvent là que se cachent les fraudes les plus fréquentes.</p>

<h2>Les indices sur le document lui-même</h2>
<ul>
<li><strong>Typographie</strong> : polices différentes sur une même ligne, caractères mal alignés, espacements irréguliers.</li>
<li><strong>Visuels</strong> : logo flou ou pixellisé, couleurs inhabituelles, cadres décalés.</li>
<li><strong>Photo</strong> : contours nets autour de la photo (collage), photo qui ne correspond pas à l'âge.</li>
<li><strong>Dates</strong> : date d'expiration antérieure à la délivrance, facture datée un dimanche pour un service fermé, date future.</li>
<li><strong>Calculs</strong> : sur un bulletin de salaire, le net ne correspond pas au brut moins les cotisations ; sur une facture, le total ne correspond pas aux lignes.</li>
<li><strong>Identifiants</strong> : MRZ incohérente avec les données visibles, numéro client au format inhabituel, numéro d'immatriculation de l'employeur introuvable.</li>
<li><strong>Fichier PDF</strong> : informations du fichier indiquant une modification par un logiciel de retouche (si l'établissement a des outils pour le voir).</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> le bulletin de salaire de M. C. indique un employeur « Transports Beta SARL ». Une recherche montre que cette société a été radiée avant la date du bulletin. Le document peut être faux, ou M. C. a pu se tromper de bulletin : on demande des explications et d'autres pièces (contrat, relevés montrant le versement du salaire).</p></div>

<h2>Les incohérences entre pièces et avec le profil</h2>
<ul>
<li>Nom, prénom ou date de naissance différents d'une pièce à l'autre.</li>
<li>Adresses différentes sans explication (justificatif / avis d'imposition / bulletin).</li>
<li>Revenus élevés sur les bulletins mais avis d'imposition modeste (ou l'inverse).</li>
<li>Profession déclarée sans rapport avec l'âge, la formation ou les flux.</li>
<li>Coordonnées (téléphone, e-mail, adresse) partagées avec d'autres dossiers sans lien apparent.</li>
<li>Compte de réception des fonds ouvert dans un pays sans lien avec le client.</li>
</ul>

<h2>Les indices de comportement</h2>
<ul>
<li><strong>Urgence</strong> injustifiée (« il me faut le compte aujourd'hui »).</li>
<li>Refus de rencontrer, de fournir l'original ou une pièce complémentaire.</li>
<li>Réponses récitées ou incohérentes sur sa propre situation (date de naissance hésitante, adresse inconnue).</li>
<li>Un tiers qui répond à la place du client ou l'accompagne systématiquement.</li>
</ul>
<div class="callout warn"><p>Un indice isolé n'est pas une preuve. Ce qui compte, c'est le <strong>faisceau d'indices</strong> et l'absence d'explication satisfaisante. Une personne en situation de précarité peut avoir des papiers abîmés ou incomplets sans être fraudeuse : ton expérience t'aidera à faire la différence.</p></div>

<h2>Que faire face à un document douteux ?</h2>
<ol>
<li><strong>Ne pas valider</strong> et ne pas exécuter l'opération en lien avec ce document tant que le doute persiste.</li>
<li><strong>Ne pas accuser</strong> le client ni lui faire part de tes soupçons : on demande simplement des éléments complémentaires.</li>
<li><strong>Documenter</strong> précisément les constats (quels indices, sur quelle pièce, quelle date), en conservant les pièces selon la procédure.</li>
<li><strong>Escalader</strong> à la conformité / à l'équipe fraude selon la procédure. C'est elle qui décidera, le cas échéant, d'un refus et d'une déclaration de soupçon.</li>
</ol>

  lesson: `
<h2>Les sanctions financières, c'est quoi ?</h2>
<p>Des États ou des organisations internationales décident parfois de <strong>sanctionner</strong> des personnes, des entités (sociétés, groupes) ou des pays : pour lutter contre le terrorisme, contre la prolifération des armes, ou en réponse à des violations graves du droit international ou des droits humains. Ces décisions prennent la forme de <strong>mesures restrictives</strong>, dont les plus courantes pour une banque sont :</p>
<ul>
<li>le <strong>gel des avoirs</strong> des personnes et entités désignées (jour 2) ;</li>
<li>l'<strong>interdiction de mettre des fonds à leur disposition</strong> ;</li>
<li>des <strong>embargos</strong> ou <strong>restrictions sectorielles</strong> (interdiction de certains échanges, produits ou services avec un pays).</li>
</ul>
<p>Les personnes et entités visées sont inscrites sur des <strong>listes</strong>. Le travail de l'analyste consiste notamment à vérifier que les clients et les opérations de la banque ne concernent pas ces personnes.</p>
<div class="callout"><p><strong>Différence importante avec la déclaration de soupçon :</strong> pour les sanctions, il n'y a pas de « soupçon » à apprécier. Si une personne est désignée, les mesures s'appliquent, quel que soit le montant ou l'origine des fonds.</p></div>

<h2>Les trois grandes sources de listes</h2>
<table><thead><tr><th>Source</th><th>Qui décide ?</th><th>Ce qu'il faut retenir</th></tr></thead><tbody>
<tr><td><strong>ONU</strong></td><td>Le Conseil de sécurité des Nations unies</td><td>Des régimes de sanctions par pays ou par thème (par exemple le terrorisme). Ils sont mis en œuvre dans l'Union européenne par des actes européens.</td></tr>
<tr><td><strong>Union européenne</strong></td><td>Le Conseil de l'UE</td><td>Des mesures restrictives adoptées par règlements, directement applicables dans tous les États membres, donc en France.</td></tr>
<tr><td><strong>OFAC</strong></td><td>Office of Foreign Assets Control, service du Trésor des États-Unis</td><td>Des sanctions américaines, dont la liste la plus connue est la liste <strong>SDN</strong> (<em>Specially Designated Nationals</em>).</td></tr>
</tbody></table>
<p>À cela s'ajoutent des <strong>mesures nationales</strong> : la France peut elle-même décider de geler les avoirs de certaines personnes.</p>
<span class="verify">les modalités de transposition des sanctions de l'ONU dans l'UE, l'autorité française compétente pour les mesures nationales et les règles d'application de chaque régime doivent être confirmées dans les textes officiels.</span>

<h3>Pourquoi une banque française regarde-t-elle les listes américaines ?</h3>
<p>Les sanctions de l'OFAC s'appliquent d'abord aux personnes et entreprises américaines. Mais elles peuvent avoir des effets pour des opérations ayant un <strong>lien avec les États-Unis</strong> (par exemple des paiements en dollars américains passant par le système financier américain). C'est pourquoi beaucoup de groupes bancaires européens intègrent les listes OFAC dans leur politique de sanctions.</p>
<span class="verify">la portée exacte des sanctions américaines pour un établissement européen est une question juridique complexe ; chaque banque l'encadre dans sa politique interne.</span>

<h2>Le filtrage (screening)</h2>
<p>Comme personne ne peut connaître des milliers de noms par cœur, les banques utilisent des <strong>outils de filtrage</strong> qui comparent automatiquement leurs données aux listes. On distingue :</p>
<ul>
<li>le <strong>filtrage de la clientèle</strong> : à l'entrée en relation, puis régulièrement sur toute la base clients (et à chaque mise à jour des listes) ;</li>
<li>le <strong>filtrage des opérations</strong> : avant d'exécuter un virement, l'outil vérifie le donneur d'ordre, le bénéficiaire, les banques intermédiaires, les pays et parfois le libellé du paiement.</li>
</ul>
<p>Quand l'outil trouve une ressemblance, il génère une <strong>alerte</strong> (en anglais, un <em>hit</em>). Le paiement est alors en général bloqué en attendant l'analyse.</p>

<h2>Homonymies et faux positifs</h2>
<p>Les outils fonctionnent par <strong>correspondance approximative</strong> : ils détectent aussi les noms proches, les inversions nom/prénom, les différentes façons d'écrire un nom traduit d'un autre alphabet (translittération). Résultat : la grande majorité des alertes sont des <strong>faux positifs</strong>, c'est-à-dire des homonymes ou des ressemblances.</p>
<p>Pour trancher, on compare les <strong>identifiants</strong> :</p>
<table><thead><tr><th>Élément</th><th>Client / opération</th><th>Personne listée</th></tr></thead><tbody>
<tr><td>Nom, prénoms, alias</td><td>…</td><td>…</td></tr>
<tr><td>Date et lieu de naissance</td><td>…</td><td>…</td></tr>
<tr><td>Nationalité</td><td>…</td><td>…</td></tr>
<tr><td>Adresse / pays</td><td>…</td><td>…</td></tr>
<tr><td>Numéro de document, d'immatriculation</td><td>…</td><td>…</td></tr>
</tbody></table>
<ul>
<li>Des identifiants <strong>clairement différents</strong> (date de naissance, nationalité…) → <strong>faux positif</strong> : on clôt l'alerte en <strong>documentant</strong> la comparaison.</li>
<li>Des identifiants qui <strong>concordent</strong> → <strong>correspondance avérée</strong> (<em>true hit</em>) : on applique les mesures (gel) et on escalade immédiatement.</li>
<li>Des informations <strong>insuffisantes</strong> pour conclure → on ne débloque pas, on <strong>complète</strong> (demande d'informations) et on escalade selon la procédure.</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> un virement vers « Ahmed BEN-FICTIF » déclenche une alerte sur « Ahmad BENFICTIF », inscrit sur une liste. La personne listée est née plusieurs décennies avant le bénéficiaire, a une autre nationalité et réside dans un autre pays. Conclusion : faux positif, documenté, paiement libéré selon la procédure.</p></div>
<div class="callout warn"><p>Ne jamais clore une alerte « parce que c'est sûrement un homonyme ». La conclusion doit reposer sur des <strong>identifiants comparés</strong> et être <strong>tracée</strong>. Et une origine, un prénom ou une nationalité ne sont jamais, à eux seuls, un élément de correspondance.</p></div>
`,

<li>Rédige la note de clôture en 3 à 5 lignes. (C'est le modèle de ta <strong>note type n° 5</strong>.)</li>
</ol>`,

  lesson: `
<h2>Le principe</h2>
<p>Le <strong>gel des avoirs</strong> est une mesure qui empêche une personne ou une entité désignée d'utiliser ses fonds et ressources économiques. Concrètement, pour une banque, cela signifie deux interdictions :</p>
<ol>
<li><strong>Ne pas laisser bouger</strong> les fonds de la personne désignée : pas de retrait, pas de virement sortant, pas de clôture avec restitution des fonds, pas d'utilisation de carte…</li>
<li><strong>Ne pas mettre de fonds à sa disposition</strong>, directement ou indirectement : pas de virement à son profit, pas de prêt, pas de paiement à une société qu'elle contrôle.</li>
</ol>
<p>Le gel ne retire pas la propriété des fonds : ils sont <strong>immobilisés</strong>, pas confisqués.</p>
<div class="callout"><p><strong>Image simple :</strong> le compte est « mis sous cloche ». L'argent reste là, mais personne ne peut ni le sortir, ni en ajouter au bénéfice de la personne désignée (sauf autorisation de l'autorité compétente).</p></div>

<h2>Une obligation immédiate</h2>
<p>Le gel s'applique dès que la désignation est en vigueur. Il ne dépend ni d'un soupçon, ni d'un montant, ni de l'accord du client. C'est pour cela que les listes doivent être intégrées rapidement dans les outils de filtrage, et que les alertes « sanctions » sont traitées en priorité.</p>
<span class="verify">les délais d'application, de mise à jour des listes et d'information des autorités sont fixés par les textes ; je ne les chiffre pas ici.</span>

<h2>Les personnes et entités concernées</h2>
<ul>
<li>Les personnes et entités <strong>inscrites</strong> sur les listes applicables.</li>
<li>Selon les régimes, les entités <strong>détenues ou contrôlées</strong> par une personne désignée peuvent aussi être concernées, même si elles ne figurent pas elles-mêmes sur la liste.</li>
</ul>
<span class="verify">les critères de détention ou de contrôle qui étendent le gel à des entités non listées diffèrent selon les régimes et les autorités : se reporter aux textes et aux orientations officielles.</span>
<div class="callout ex"><p><strong>Exemple fictif :</strong> la société « Zeta Logistique » n'est pas sur une liste, mais ton analyse KYC montre qu'elle est contrôlée par une personne désignée. Ce lien doit être immédiatement signalé à la conformité : la société peut être concernée par le gel.</p></div>

<h2>Conduite à tenir en cas de correspondance avérée</h2>
<ol>
<li><strong>Ne pas exécuter</strong> l'opération et bloquer les fonds concernés.</li>
<li><strong>Escalader immédiatement</strong> à l'équipe sanctions / conformité, avec le dossier de comparaison des identifiants.</li>
<li>La conformité procède à l'<strong>information de l'autorité compétente</strong> selon les modalités prévues.</li>
<li><strong>Documenter</strong> tout : alerte, analyse, décisions, dates, intervenants.</li>
<li>Toute opération ultérieure (par exemple payer un loyer ou des frais de base) ne peut se faire que si l'autorité compétente l'<strong>autorise</strong>.</li>
</ol>
<span class="verify">l'autorité française compétente en matière de gel des avoirs (le ministère de l'Économie, via la Direction générale du Trésor, est généralement cité), le canal et le délai d'information, ainsi que les procédures d'autorisation (dérogations), doivent être vérifiés dans les textes officiels.</span>

<h2>Gel des avoirs et déclaration de soupçon : deux circuits</h2>
<table><thead><tr><th></th><th>Gel des avoirs</th><th>Déclaration de soupçon</th></tr></thead><tbody>
<tr><td>Déclencheur</td><td>Une personne désignée sur une liste</td><td>Un soupçon fondé sur des faits</td></tr>
<tr><td>Appréciation</td><td>Aucune marge : la mesure s'applique</td><td>Analyse de l'établissement</td></tr>
<tr><td>Destinataire</td><td>L'autorité compétente en matière de gel</td><td>Tracfin</td></tr>
</tbody></table>
<p>Les deux peuvent se cumuler : une tentative de contourner un gel (par exemple faire passer les fonds par un proche) peut aussi justifier une déclaration de soupçon.</p>
<span class="verify">l'articulation exacte entre information de l'autorité de gel et déclaration de soupçon à Tracfin est précisée par les textes et les lignes directrices ACPR / Tracfin.</span>

<h2>Le contournement : ce qu'il faut savoir repérer</h2>
<ul>
<li>Fonds transférés au nom d'un <strong>proche</strong> ou d'un <strong>prête-nom</strong> peu avant ou après une désignation.</li>
<li>Changement soudain d'actionnariat pour faire passer la détention sous des seuils de contrôle.</li>
<li>Paiements via des pays ou intermédiaires sans lien logique avec l'opération.</li>
<li>Libellés de virement vagues, ou modification du nom du bénéficiaire après un premier blocage.</li>
</ul>
<div class="callout warn"><p>Un blocage pour sanctions ne s'explique pas au client avec des détails sur les listes ou les soupçons : on suit les éléments de langage prévus par la procédure et on laisse la conformité gérer la communication.</p></div>
`,
