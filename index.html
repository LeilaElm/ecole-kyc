  lesson: `
<h2>Pourquoi parler de « pays à risque » ?</h2>
<p>Tous les pays n'ont pas le même niveau de protection contre le blanchiment et le financement du terrorisme. Certains ont des contrôles faibles, une corruption importante, un secret bancaire fort, des zones de conflit ou des groupes terroristes actifs. Les flux liés à ces pays présentent donc un <strong>risque géographique</strong> plus élevé : c'est l'un des quatre facteurs de risque vus en semaine 2.</p>

<h2>Les listes publiées par le GAFI</h2>
<p>Après ses évaluations, le GAFI publie régulièrement deux listes de juridictions :</p>
<table><thead><tr><th>Liste</th><th>Surnom courant</th><th>Signification</th></tr></thead><tbody>
<tr><td>Juridictions à haut risque faisant l'objet d'un <strong>appel à l'action</strong></td><td>« liste noire »</td><td>Défaillances stratégiques graves ; le GAFI appelle ses membres à appliquer une vigilance renforcée, voire des contre-mesures.</td></tr>
<tr><td>Juridictions sous <strong>surveillance renforcée</strong></td><td>« liste grise »</td><td>Pays qui ont des défaillances mais se sont engagés à les corriger selon un plan d'action, sous suivi du GAFI.</td></tr>
</tbody></table>
<p>Ces listes <strong>évoluent</strong> : des pays y entrent, d'autres en sortent. Il faut donc toujours consulter la version en vigueur, jamais une liste apprise par cœur.</p>
<span class="verify">la composition actuelle des listes du GAFI, leur rythme de mise à jour et les conséquences juridiques de chaque liste doivent être vérifiés sur la publication officielle en vigueur.</span>

<h2>La liste de l'Union européenne</h2>
<p>L'Union européenne établit aussi sa propre liste de <strong>pays tiers à haut risque</strong>, qui s'appuie notamment sur les travaux du GAFI. Lorsqu'une relation ou une opération implique un pays de cette liste, des <strong>mesures de vigilance renforcée</strong> spécifiques s'appliquent.</p>
<span class="verify">le contenu de la liste européenne et les mesures de vigilance renforcée qu'elle impose sont fixés par les textes européens et français ; vérifie la version applicable.</span>

<h2>Liste de pays à risque ≠ liste de sanctions</h2>
<div class="callout warn"><p>C'est une confusion fréquente en entretien ! Un pays sur la liste grise du GAFI n'est <strong>pas</strong> sous embargo : on peut avoir des clients et des opérations liés à ce pays, avec une <strong>vigilance adaptée</strong>. À l'inverse, les sanctions (jour 1) visent des personnes, entités ou secteurs précis et imposent des <strong>interdictions</strong>.</p></div>

<h2>Comment l'analyste utilise le risque pays</h2>
<p>Le risque géographique ne se limite pas aux listes du GAFI. Les établissements construisent souvent une <strong>classification interne des pays</strong> qui combine plusieurs critères : listes officielles, régimes de sanctions, niveau de corruption, présence de groupes terroristes, transparence fiscale… Le pays peut intervenir à plusieurs niveaux :</p>
<ul>
<li><strong>Le client</strong> : résidence, nationalité (comme simple facteur de risque, jamais comme motif de discrimination), siège de la société.</li>
<li><strong>Les bénéficiaires effectifs</strong> et la chaîne de détention.</li>
<li><strong>Les flux</strong> : origine et destination des virements, banques intermédiaires.</li>
<li><strong>L'activité</strong> : fournisseurs et clients d'une entreprise.</li>
</ul>
<div class="callout ex"><p><strong>Exemple fictif :</strong> M. F., ingénieur résidant en France, envoie chaque mois une petite somme à sa mère, qui vit dans un pays figurant sur la liste grise. Le pays est un facteur de risque, mais le flux est <strong>cohérent</strong> (montant stable, lien familial expliqué, revenus suffisants). Vigilance adaptée, pas de soupçon.</p></div>
<div class="callout ex"><p><strong>Exemple fictif :</strong> la société « Rho Trading », sans activité visible dans le pays, reçoit soudainement de nombreux virements provenant d'un pays faisant l'objet d'un appel à l'action, et les réexpédie aussitôt ailleurs. Ici, le risque géographique s'ajoute à une <strong>incohérence</strong> : examen renforcé et escalade.</p></div>

<h2>À retenir</h2>
<ul>
<li>Le pays est un <strong>facteur de risque</strong>, pas une preuve.</li>
<li>Toujours utiliser la <strong>liste en vigueur</strong>.</li>
<li>Combiner le risque pays avec la <strong>cohérence</strong> du flux et du profil.</li>
<li>Ne pas confondre <strong>pays à risque</strong> (vigilance) et <strong>sanctions</strong> (interdictions).</li>
</ul>
`,

  lesson: `
<h2>De quoi parle-t-on ?</h2>
<p>Les <strong>sources ouvertes</strong> sont les informations <strong>accessibles légalement au public</strong> : registres officiels, presse, sites d'entreprises, publications légales… En anglais, on parle d'<strong>OSINT</strong> (<em>Open Source Intelligence</em>). Dans un service KYC, on les utilise pour <strong>compléter</strong> et <strong>vérifier</strong> ce que dit le client, et pour repérer la <strong>presse négative</strong> (<em>adverse media</em>) : articles évoquant fraude, corruption, blanchiment, terrorisme, etc.</p>
<div class="callout"><p><strong>Ton atout :</strong> en service social, tu vérifies déjà des informations auprès de sources fiables et tu sais distinguer un fait d'une rumeur. C'est exactement la compétence attendue.</p></div>

<h2>Les grands types de sources</h2>
<table><thead><tr><th>Type de source</th><th>Exemples génériques</th><th>Fiabilité</th></tr></thead><tbody>
<tr><td>Registres et publications officiels</td><td>Registre du commerce, publications légales des sociétés, journaux officiels, décisions publiées</td><td>Élevée</td></tr>
<tr><td>Sites institutionnels</td><td>Autorités, régulateurs, organisations internationales (communiqués, listes)</td><td>Élevée</td></tr>
<tr><td>Presse reconnue</td><td>Journaux nationaux et régionaux, agences de presse</td><td>Bonne, à recouper</td></tr>
<tr><td>Bases de données professionnelles</td><td>Outils payants utilisés par les banques (PPE, sanctions, presse négative)</td><td>Bonne, mais à vérifier à la source</td></tr>
<tr><td>Sites des entreprises</td><td>Site internet, rapports annuels, communication</td><td>Moyenne (déclaratif)</td></tr>
<tr><td>Réseaux sociaux, forums, blogs</td><td>Profils publics, avis, discussions</td><td>Faible : à manier avec une grande prudence</td></tr>
</tbody></table>

<h2>La méthode en 6 étapes</h2>
<ol>
<li><strong>Définir la question</strong> : que cherches-tu à vérifier ? (l'activité de la société existe-t-elle ? le client a-t-il une presse négative ? est-il PPE ?)</li>
<li><strong>Rassembler les identifiants</strong> : nom complet et variantes d'écriture, date de naissance, ville, société, fonction.</li>
<li><strong>Chercher</strong> : le nom seul, puis le nom combiné à des mots-clés (fraude, escroquerie, corruption, blanchiment, condamnation, enquête, sanctions…), éventuellement dans les langues des pays concernés.</li>
<li><strong>Évaluer chaque résultat</strong> : qui publie ? quand ? est-ce un fait (condamnation) ou une allégation (enquête, accusation) ? l'information est-elle recoupée par une autre source fiable ?</li>
<li><strong>Rattacher à la bonne personne</strong> : l'article concerne-t-il vraiment ton client ? (âge, ville, fonction, société…) Sinon, c'est une homonymie.</li>
<li><strong>Tracer</strong> : noter la source, la date de publication, la date de consultation, et conserver une capture ou un extrait selon la procédure.</li>
</ol>
<div class="callout ex"><p><strong>Exemple fictif :</strong> en cherchant « Marc DUFICTIF + fraude », tu trouves un article régional sur un « Marc Dufictif, 62 ans, garagiste à Rennes, condamné pour fraude aux aides ». Ton client a 35 ans, est développeur informatique à Grenoble. Conclusion : homonymie probable ; on le note, avec les éléments de comparaison.</p></div>

<h2>Fait, allégation, rumeur</h2>
<ul>
<li><strong>Fait établi</strong> : une condamnation définitive publiée, une sanction officielle.</li>
<li><strong>Allégation</strong> : une mise en examen, une enquête en cours, une accusation dans la presse. La personne est présumée innocente, mais l'information est un <strong>facteur de risque</strong> à prendre en compte.</li>
<li><strong>Rumeur</strong> : un commentaire anonyme, un forum. À ne jamais utiliser seule.</li>
</ul>
<p>Dans ta note, tu emploies les mots justes : « selon un article de [type de média] daté de…, M. X serait mis en cause dans… » plutôt que « M. X est un fraudeur ».</p>

<h2>Les limites à respecter</h2>
<ul>
<li>Rester dans les sources <strong>publiques</strong> : pas de faux profil, pas de demande d'« ami », pas d'accès à des contenus privés.</li>
<li>Faire des recherches <strong>proportionnées</strong> au risque et au besoin du dossier.</li>
<li>Ne conserver que ce qui est <strong>utile</strong> à l'analyse.</li>
</ul>
<span class="verify">les règles de protection des données personnelles (RGPD) et la politique interne de l'établissement encadrent ces recherches et la conservation des informations ; vérifie le cadre applicable.</span>
`,

  lesson: `
<h2>À quoi sert une note de justification ?</h2>
<p>Chaque décision KYC (valider, demander un complément, escalader, refuser, clôturer une alerte) doit pouvoir être <strong>comprise et vérifiée</strong> plus tard par quelqu'un qui ne connaît pas le dossier : un responsable, un auditeur, un contrôleur du superviseur. La note de justification est la <strong>mémoire</strong> de ton analyse.</p>
<div class="callout"><p><strong>Bonne nouvelle :</strong> tu sais déjà le faire. Une note sociale factuelle et une note KYC partagent les mêmes qualités : faits datés, neutralité, distinction entre ce qui est constaté et ce qui est déclaré, conclusion claire. Seuls le vocabulaire et les critères changent.</p></div>

<h2>La structure en 5 blocs (méthode « CFAIC »)</h2>
<table><thead><tr><th>Bloc</th><th>Contenu</th><th>Exemple de formulation</th></tr></thead><tbody>
<tr><td><strong>C</strong>ontexte</td><td>Qui, quelle relation, pourquoi la note</td><td>« Alerte sur dépôt d'espèces, client salarié, en relation depuis… »</td></tr>
<tr><td><strong>F</strong>aits</td><td>Opérations, montants, dates, pays</td><td>« Le [date], dépôt de … € en espèces. »</td></tr>
<tr><td><strong>A</strong>nalyse</td><td>Pièces examinées, recherches, explications du client</td><td>« Le client indique… ; aucun justificatif fourni. »</td></tr>
<tr><td><strong>I</strong>ncohérences / risques</td><td>Ce qui ne colle pas, ou l'absence d'anomalie</td><td>« Montant sans rapport avec les revenus déclarés. »</td></tr>
<tr><td><strong>C</strong>onclusion</td><td>Décision proposée et suites</td><td>« Proposition : demande de justificatif ; à défaut, transmission au déclarant. »</td></tr>
</tbody></table>
<p>Pour une décision simple, la note tient en <strong>3 à 6 lignes</strong>. Pour un dossier complexe, quelques paragraphes suffisent : un relecteur doit comprendre l'essentiel en une minute.</p>

<h2>Les règles d'écriture</h2>
<ul>
<li><strong>Factuel</strong> : « le client a déposé » plutôt que « le client a voulu cacher ».</li>
<li><strong>Distinguer les sources</strong> : « selon le client… », « d'après l'acte notarié… », « l'outil indique… ».</li>
<li><strong>Précis</strong> : dates, montants, pièces nommées. Pas de « récemment », « beaucoup », « bizarre ».</li>
<li><strong>Neutre</strong> : pas de jugement de valeur, pas de supposition sur la personne, aucune mention de nationalité, origine ou religion comme argument.</li>
<li><strong>Complet mais court</strong> : tout ce qui fonde la décision, rien de superflu.</li>
<li><strong>Une conclusion explicite</strong> : la décision proposée doit être lisible au premier coup d'œil.</li>
</ul>
<table><thead><tr><th>❌ À éviter</th><th>✅ Préférer</th></tr></thead><tbody>
<tr><td>« Client louche, trop d'espèces. »</td><td>« Trois dépôts d'espèces en dix jours, pour un total sans rapport avec le salaire déclaré. »</td></tr>
<tr><td>« Il a menti sur son adresse. »</td><td>« L'adresse du justificatif diffère de l'adresse déclarée ; explication demandée. »</td></tr>
<tr><td>« C'est sûrement un homonyme. »</td><td>« Date de naissance et nationalité différentes de la personne listée : faux positif. »</td></tr>
</tbody></table>

<h2>Les 5 notes types de ton livrable</h2>
<p>Ton livrable de la semaine est une bibliothèque de <strong>5 modèles réutilisables</strong>. Ils sont pré-remplis par tes réponses aux études de cas, et tu les retravailles dans <a href="#/livrables">Mes livrables</a> en remplaçant les éléments propres au cas par des champs [entre crochets].</p>

<li><strong>Escalade en vigilance renforcée</strong> (cas 3)</li>
<li><strong>Refus pour pièces incohérentes</strong> (cas 4)</li>
<li><strong>Clôture d'alerte de filtrage (faux positif)</strong> (cas 5, et exercice du jour 1)</li>
</ol>
<div class="callout ex"><p><strong>Exemple de modèle (note type 2) :</strong> « [Client], [profession], en relation depuis [date]. Le [date], [opération] de [montant] provenant de [origine]. Le client indique [explication]. Pièces fournies : [liste / aucune]. L'opération est [cohérente / incohérente] avec le profil connu ([revenus, activité]). Proposition : demande de [justificatif précis] ; mise en attente selon la procédure ; à défaut de justification, transmission au déclarant. »</p></div>

  lesson: `
<h2>Une journée type d'analyste KYC / LCB-FT</h2>
<p>Selon l'établissement et l'équipe, les tâches varient, mais on retrouve souvent :</p>
<ul>
<li><strong>Entrées en relation</strong> : contrôler les dossiers d'ouverture (pièces, bénéficiaires effectifs, niveau de risque) et valider, compléter ou escalader.</li>
<li><strong>Revues périodiques</strong> (« revues KYC ») : mettre à jour les dossiers des clients existants, en priorité ceux à risque élevé.</li>
<li><strong>Remédiation</strong> : rattraper des dossiers incomplets en masse, souvent dans le cadre de projets.</li>
<li><strong>Traitement d'alertes</strong> : alertes de surveillance des opérations (opérations inhabituelles) ou de filtrage (sanctions, PPE).</li>
<li><strong>Rédaction</strong> : notes de justification, synthèses pour la conformité, préparation d'éléments pour le déclarant.</li>
<li><strong>Échanges</strong> : avec les conseillers clientèle (qui sont en contact avec le client), la conformité, parfois les équipes fraude.</li>
</ul>
<p>Le travail se fait surtout <strong>sur écran</strong>, avec des outils internes (dossier client, outil de scoring, outil de filtrage, base documentaire) et des <strong>objectifs de volume et de qualité</strong>.</p>

<h2>Les intitulés de poste à connaître</h2>
<p>Le même métier porte des noms différents selon les employeurs. Pense à tous les chercher :</p>
<ul>
<li>Analyste KYC / Chargé(e) de connaissance client</li>
<li>Analyste LCB-FT / Analyste AML</li>
<li>Chargé(e) de conformité / Compliance officer junior</li>
<li>Analyste sécurité financière</li>
<li>Analyste alertes / transaction monitoring</li>
<li>Analyste sanctions / screening</li>
<li>Gestionnaire back-office KYC / Chargé(e) de remédiation KYC</li>
</ul>
<p>Pour une reconversion, les postes d'<strong>analyste KYC junior</strong>, de <strong>remédiation</strong> ou de <strong>traitement d'alertes de niveau 1</strong> sont souvent les plus accessibles.</p>

<h2>Tes compétences transférables</h2>
<p>Tu ne pars pas de zéro, loin de là. Voici la correspondance entre ton métier et le métier visé :</p>
<table><thead><tr><th>Ce que tu fais en tant qu'assistante sociale</th><th>Ce que cela devient en KYC</th></tr></thead><tbody>
<tr><td>Instruire des dossiers administratifs (aides, droits, prestations)</td><td>Contrôle documentaire, constitution et revue de dossiers clients</td></tr>
<tr><td>Vérifier la cohérence des ressources, charges et pièces justificatives</td><td>Analyse de cohérence économique, origine des fonds</td></tr>
<tr><td>Rédiger des écrits professionnels factuels (rapports, signalements, notes)</td><td>Notes de justification, synthèses d'analyse</td></tr>
<tr><td>Évaluer une situation et graduer son intervention</td><td>Approche par les risques, niveaux de vigilance</td></tr>
<tr><td>Respecter le secret professionnel et la confidentialité</td><td>Confidentialité, interdiction d'informer le client d'une déclaration</td></tr>
<tr><td>Repérer des signaux faibles et transmettre selon une procédure</td><td>Détection d'anomalies et escalade</td></tr>
<tr><td>Conduire des entretiens, poser des questions neutres</td><td>Demandes de compléments, échanges avec les conseillers</td></tr>
<tr><td>Travailler en réseau avec des partenaires et des institutions</td><td>Travail avec la conformité, le juridique, les équipes métier</td></tr>
<tr><td>Gérer une file active et des urgences</td><td>Gestion d'un portefeuille de dossiers et de délais</td></tr>
</tbody></table>
<div class="callout"><p><strong>Le message clé à faire passer aux recruteurs :</strong> « Mon métier consiste déjà à analyser des dossiers, repérer les incohérences et rédiger des écrits factuels dans un cadre réglementaire et confidentiel. J'ai complété ces compétences par une formation aux fondamentaux de la LCB-FT. »</p></div>

<h2>Ce qui va changer pour toi</h2>
<ul>
<li>L'objet de ton analyse n'est plus l'<strong>accompagnement</strong> de la personne, mais la <strong>protection de l'établissement</strong> et du système financier.</li>
<li>Tu seras moins en contact direct avec les personnes, davantage avec des <strong>dossiers et des outils</strong>.</li>
<li>Le rythme est souvent piloté par des <strong>indicateurs</strong> (nombre de dossiers, délais, taux de qualité).</li>
<li>Le vocabulaire est très <strong>anglicisé</strong> (KYC, AML, screening, due diligence, hit…) : tes flashcards sont là pour ça.</li>
</ul>
<p>Montrer en entretien que tu as <strong>conscience de ces différences</strong> rassure beaucoup les recruteurs sur ta motivation.</p>
`,

    prompt: `<p>Construis ton propre tableau de compétences transférables :</p>
<ol>
<li>Choisis <strong>4 situations réelles</strong> de ton parcours (sans aucune donnée personnelle sur les usagers).</li>
<li>Pour chacune, écris : la situation en une ligne → la compétence → sa traduction en vocabulaire KYC.</li>
<li>Termine par ta phrase clé de reconversion (2 lignes maximum).</li>
</ol>
<p>Le bouton ci-dessous l'ajoute à ta rubrique « CV » dans Mes livrables.</p>`,

{
  id: "4-2",
  title: "Adapter ton CV : mots-clés et reformulation",
  minutes: 14,
  lesson: `
<h2>Pourquoi les mots-clés comptent autant</h2>
<p>Beaucoup de recruteurs et de logiciels de tri de candidatures cherchent des <strong>mots-clés</strong> précis. Un CV d'assistante sociale qui ne contient ni « KYC » ni « conformité » risque d'être écarté avant même d'être lu, alors que ton expérience est pertinente. L'objectif : <strong>traduire</strong> ton parcours dans la langue du secteur, sans rien inventer.</p>

<h2>La banque de mots-clés</h2>
<table><thead><tr><th>Famille</th><th>Mots-clés</th></tr></thead><tbody>
<tr><td>Métier</td><td>KYC, connaissance client, LCB-FT, AML/CFT, conformité, sécurité financière</td></tr>
<tr><td>Contrôles</td><td>vigilance (simplifiée, standard, renforcée), due diligence, contrôle documentaire, bénéficiaire effectif, PPE, origine des fonds</td></tr>
<tr><td>Outils / process</td><td>screening, filtrage, sanctions, gel des avoirs, alertes, revue périodique, remédiation, approche par les risques</td></tr>
<tr><td>Rédaction</td><td>note de justification, synthèse, traçabilité, escalade, reporting</td></tr>
<tr><td>Savoir-être</td><td>rigueur, esprit d'analyse, confidentialité, sens de l'éthique, organisation, respect des délais</td></tr>
</tbody></table>
<div class="callout warn"><p><strong>Règle d'or :</strong> n'écris que ce que tu sais faire ou as appris. Mets les notions apprises dans une rubrique « Formation » ou « Compétences LCB-FT acquises en formation », et tes expériences réelles dans « Expérience ». Un recruteur te posera des questions sur chaque mot-clé.</p></div>

<h2>La structure du CV de reconversion</h2>
<ol>
<li><strong>Titre</strong> : le poste visé, pas ton poste actuel. Ex. : « Analyste KYC / LCB-FT junior — profil analyse de dossiers et rédaction ».</li>
<li><strong>Accroche</strong> (3 lignes) : qui tu es, ce que tu apportes, ce que tu cherches.</li>
<li><strong>Compétences clés</strong> : 6 à 8 puces avec les mots-clés.</li>
<li><strong>Formation LCB-FT</strong> : cette école, et toute formation que tu suivras.</li>
<li><strong>Expérience</strong> : tes postes, avec des réalisations <strong>reformulées</strong>.</li>
<li><strong>Diplômes</strong>, langues, outils informatiques.</li>
</ol>

<h2>Reformuler tes expériences</h2>
<table><thead><tr><th>❌ Formulation d'origine</th><th>✅ Reformulation orientée KYC</th></tr></thead><tbody>
<tr><td>« Accompagnement des familles en difficulté »</td><td>« Évaluation de situations individuelles et instruction de dossiers administratifs complexes »</td></tr>
<tr><td>« Montage de dossiers d'aides »</td><td>« Contrôle de pièces justificatives et vérification de la cohérence des ressources déclarées »</td></tr>
<tr><td>« Rédaction de rapports sociaux »</td><td>« Rédaction d'écrits professionnels factuels et structurés à destination d'institutions »</td></tr>
<tr><td>« Signalements »</td><td>« Détection de situations à risque et transmission selon des procédures réglementées »</td></tr>
<tr><td>« Travail en partenariat »</td><td>« Coordination avec des interlocuteurs multiples (institutions, services internes) »</td></tr>
</tbody></table>
<p>Ajoute quand c'est possible un élément de <strong>volume</strong> ou de <strong>résultat</strong> qui te concerne vraiment (taille de ta file active, types de dossiers traités) : tu es la seule à connaître ces chiffres, n'en invente aucun.</p>

<h2>Exemple fictif : avant / après</h2>
<div class="callout ex"><p><strong>AVANT</strong><br>Assistante sociale — Centre communal d'action sociale (fictif)<br>• Accueil et accompagnement du public<br>• Montage de dossiers<br>• Travail en équipe pluridisciplinaire</p></div>
<div class="callout ex"><p><strong>APRÈS</strong><br><strong>Analyste KYC / LCB-FT junior</strong> — Rigueur documentaire, analyse de cohérence, écrits factuels<br><em>Accroche :</em> Assistante sociale diplômée, habituée à instruire des dossiers administratifs, à vérifier des pièces justificatives et à rédiger des écrits factuels dans un cadre confidentiel. Formée aux fondamentaux de la LCB-FT (KYC, vigilance, sanctions), je souhaite rejoindre une équipe conformité.<br><em>Compétences :</em> contrôle documentaire · analyse de cohérence · rédaction de notes de justification · confidentialité · approche par les risques (formation) · bénéficiaire effectif, PPE, sanctions (formation)<br><em>Expérience — Assistante sociale, CCAS (fictif) :</em><br>• Instruction de dossiers d'aides : contrôle des pièces et de la cohérence des ressources<br>• Rédaction d'écrits professionnels destinés à des institutions<br>• Détection de situations à risque et transmission selon les procédures</p></div>

<h2>Les finitions</h2>
<ul>
<li>Une à deux pages, lisible, sans fautes (le métier exige de la rigueur écrite).</li>
<li>Adapte le titre et quelques mots-clés à <strong>chaque offre</strong> : reprends ses termes exacts.</li>
<li>Un profil professionnel en ligne cohérent avec ton CV (même titre, mêmes mots-clés).</li>
<li>Ne mentionne aucune donnée sur les personnes accompagnées.</li>
</ul>
`,
  exercise: {
    prompt: `<p>Rédige directement ta rubrique CV (elle est enregistrée dans <strong>Mes livrables › Mon CV</strong>) :</p>
<ol>
<li>Ton <strong>titre</strong>.</li>
<li>Ton <strong>accroche</strong> en 3 lignes.</li>
<li>Tes <strong>8 mots-clés / compétences</strong>, en séparant ce qui vient de ton expérience et ce qui vient de ta formation.</li>
<li><strong>3 réalisations</strong> de ton parcours reformulées en vocabulaire KYC.</li>
</ol>`,
    fields: [{ key: "s4_cv", label: "Mon CV : titre, accroche, mots-clés, réalisations reformulées", rows: 14 }],
    placeholder: "",
    deliverable: null,
    correction: `<p><strong>Points de contrôle :</strong> le titre est celui du <strong>poste visé</strong> ; l'accroche dit qui tu es, ce que tu apportes et ce que tu cherches ; les mots-clés reprennent le vocabulaire du secteur (KYC, LCB-FT, vigilance, conformité, contrôle documentaire, screening…) ; les notions apprises sont présentées comme <strong>acquises en formation</strong> ; les réalisations sont formulées avec des verbes d'action (instruire, contrôler, vérifier, rédiger, transmettre) ; aucune donnée sur les usagers ; aucun chiffre inventé. Compare avec l'exemple « après » de la leçon.</p>`
  },
  quiz: [
    { q: "Pourquoi intégrer des mots-clés comme « KYC » ou « conformité » dans ton CV ?", options: ["Pour faire joli", "Parce que les recruteurs et logiciels de tri les recherchent", "Parce que c'est obligatoire par la loi", "Pour cacher ton parcours"], answer: 1, explain: "Sans les mots-clés du secteur, un CV pertinent peut être écarté avant d'être lu." },
    { q: "Le titre d'un CV de reconversion doit indiquer :", options: ["Ton poste actuel", "Le poste visé", "Ton âge", "Ta situation familiale"], answer: 1, explain: "Le titre annonce le poste visé, par exemple « Analyste KYC / LCB-FT junior »." },
    { q: "Où placer les notions LCB-FT apprises dans cette formation ?", options: ["Dans l'expérience professionnelle, comme si tu les avais pratiquées", "Dans une rubrique formation / compétences acquises en formation", "Nulle part", "Dans les loisirs"], answer: 1, explain: "On reste honnête : ce qui est appris en formation est présenté comme tel." },
    { q: "Quelle reformulation de « montage de dossiers d'aides » est la plus pertinente ?", options: ["« Aide aux gens »", "« Contrôle de pièces justificatives et vérification de la cohérence des ressources déclarées »", "« Gestion de la paperasse »", "« Analyste KYC senior »"], answer: 1, explain: "On traduit l'expérience réelle dans le vocabulaire du métier, sans exagérer le niveau." },
    { q: "Faut-il adapter le CV à chaque offre ?", options: ["Non, jamais", "Oui, au moins le titre et quelques mots-clés repris de l'offre", "Seulement la photo", "Seulement pour les néobanques"], answer: 1, explain: "Reprendre les termes exacts de l'offre augmente la pertinence perçue de la candidature." }
  ]

{
  id: "4-3",
  title: "Où postuler",
  minutes: 11,
  lesson: `
<h2>Qui recrute des analystes KYC / LCB-FT ?</h2>
<p>Tous les professionnels soumis aux obligations LCB-FT (les « assujettis » vus en semaine 1) ont besoin de ces compétences. Les principaux types d'employeurs :</p>
<table><thead><tr><th>Type d'employeur</th><th>Ce qu'il faut savoir</th></tr></thead><tbody>
<tr><td><strong>Banques traditionnelles</strong> (réseaux, banques privées, banques d'investissement)</td><td>Grandes équipes KYC et conformité, souvent des centres de traitement ; procédures très structurées, bonne école pour débuter.</td></tr>
<tr><td><strong>Néobanques et banques en ligne</strong></td><td>Entrées en relation à distance, volumes importants, outils numériques ; rythme rapide.</td></tr>
<tr><td><strong>Établissements de paiement et de monnaie électronique</strong></td><td>Beaucoup de traitement d'alertes et d'opérations ; sujets de fraude fréquents.</td></tr>
<tr><td><strong>Assurances</strong> (notamment assurance-vie)</td><td>Origine des fonds, bénéficiaires des contrats, rachats.</td></tr>
<tr><td><strong>Sociétés de gestion d'actifs</strong></td><td>KYC des investisseurs et des partenaires.</td></tr>
<tr><td><strong>Cabinets de conseil et ESN</strong></td><td>Recrutent des consultants pour des <strong>missions</strong> chez leurs clients (remédiation, revues KYC) : souvent une porte d'entrée pour les reconversions.</td></tr>
<tr><td><strong>Sociétés d'intérim spécialisées</strong></td><td>Missions temporaires en back-office KYC, qui peuvent déboucher sur une embauche.</td></tr>
<tr><td><strong>Autres professions assujetties</strong></td><td>Notariat, immobilier, cabinets d'expertise comptable, plateformes de crypto-actifs, jeux en ligne… avec des postes de conformité plus rares mais variés.</td></tr>
</tbody></table>
<p>Le <strong>secteur public</strong> intervient aussi dans la LCB-FT (services de renseignement financier, superviseurs) ; les modes de recrutement y sont spécifiques (concours, contrats).</p>
<span class="verify">les voies d'accès aux postes publics liés à la LCB-FT (concours, recrutements contractuels) doivent être vérifiées auprès des administrations concernées.</span>

<h2>Les canaux de recherche</h2>
<ul>
<li><strong>Sites d'offres d'emploi</strong> généralistes et spécialisés finance : recherche avec les différents intitulés (jour 1) et des alertes e-mail.</li>
<li><strong>Réseaux sociaux professionnels</strong> : profil à jour avec le titre visé, abonnement aux pages des employeurs, prise de contact avec des analystes ou des recruteurs (message court et précis).</li>
<li><strong>Sites carrières des employeurs</strong> : beaucoup d'offres n'apparaissent que là.</li>
<li><strong>Cabinets de recrutement et sociétés d'intérim</strong> spécialisés banque / conformité.</li>
<li><strong>Candidatures spontanées</strong> : surtout auprès des cabinets de conseil et des centres de traitement.</li>
<li><strong>Service public de l'emploi</strong> (France Travail) : accompagnement, informations sur les dispositifs de reconversion.</li>
<li><strong>Réseau personnel</strong> : anciens collègues, connaissances travaillant en banque ou assurance.</li>
</ul>

<h2>Se former et se certifier</h2>
<p>Pour rassurer un recruteur, une formation complémentaire reconnue peut aider. Il existe des formations et certifications professionnelles en conformité / LCB-FT proposées par des organismes de formation, des écoles et des associations professionnelles, en français et en anglais.</p>
<span class="verify">les formations et certifications reconnues par les employeurs, leur coût, leur durée et leur éligibilité aux dispositifs de financement (par exemple le compte personnel de formation ou les dispositifs de transition professionnelle) doivent être vérifiés auprès des organismes et des services officiels. Je ne cite volontairement aucun nom ni aucun montant.</span>

<h2>Ton plan de recherche</h2>
<ol>
<li>Cibler <strong>2 ou 3 types d'employeurs</strong> prioritaires (par exemple : cabinets de conseil pour une première mission, banques de réseau, assurances).</li>
<li>Préparer une <strong>liste d'employeurs</strong> de ta région ou en télétravail, avec un suivi (date, poste, contact, statut).</li>
<li>Créer des <strong>alertes</strong> sur chaque intitulé de poste.</li>
<li>Postuler <strong>régulièrement</strong> (par exemple quelques candidatures ciblées par semaine plutôt que beaucoup de candidatures identiques).</li>
<li><strong>Relancer</strong> poliment après un délai raisonnable.</li>
</ol>
<div class="callout"><p><strong>Astuce :</strong> les postes de remédiation et de niveau 1 recrutent souvent par vagues, pour des projets. Être réactive quand une vague s'ouvre est un vrai avantage.</p></div>
`,

<li>Les <strong>3 canaux</strong> que tu vas utiliser en priorité.</li>
<li>Un message court (5 lignes maximum) pour contacter un analyste KYC sur un réseau professionnel afin d'échanger sur son métier.</li>
</ol>`,

    correction: `<p><strong>Exemple de correction :</strong> 1) Cabinets de conseil / ESN (missions de remédiation accessibles en reconversion), banques de réseau (grandes équipes, formation interne), assurances (origine des fonds, rigueur documentaire proche de mon expérience). 2) Analyste KYC, chargé(e) de connaissance client, analyste LCB-FT, chargé(e) de remédiation KYC. 3) Sites d'offres avec alertes, réseau professionnel en ligne, candidatures spontanées auprès des cabinets. 4) « Bonjour [prénom], je suis assistante sociale en reconversion vers les métiers du KYC, que je découvre en me formant à la LCB-FT. Votre parcours m'intéresse : accepteriez-vous un court échange pour me parler de votre quotidien d'analyste ? Merci d'avance, Leila. » (Message court, précis, sans demande d'emploi directe.)</p>`
  },
  quiz: [
    { q: "Pourquoi les cabinets de conseil et ESN sont-ils une porte d'entrée intéressante ?", options: ["Ils ne demandent aucune rigueur", "Ils recrutent des consultants pour des missions KYC (remédiation, revues) chez leurs clients", "Ils sont les seuls à recruter", "Ils ne font pas de KYC"], answer: 1, explain: "Les missions de remédiation et de revue KYC accueillent souvent des profils en reconversion." },
    { q: "Lequel de ces employeurs n'est généralement PAS concerné par la LCB-FT ?", options: ["Une compagnie d'assurance-vie", "Un établissement de paiement", "Une boulangerie de quartier", "Une banque en ligne"], answer: 2, explain: "Les assujettis sont notamment les banques, assurances, établissements de paiement… pas les commerces ordinaires." },
    { q: "Quelle est la meilleure stratégie de candidature ?", options: ["Envoyer le même CV partout en masse", "Cibler quelques types d'employeurs, adapter chaque candidature et assurer un suivi", "Attendre qu'on te contacte", "Postuler uniquement à des postes seniors"], answer: 1, explain: "Des candidatures ciblées, adaptées et suivies sont plus efficaces qu'un envoi massif." },
    { q: "Pour contacter un analyste sur un réseau professionnel, il vaut mieux :", options: ["Lui demander directement un emploi", "Envoyer un message court et précis pour échanger sur son métier", "Lui envoyer ton CV sans message", "Le relancer tous les jours"], answer: 1, explain: "Une demande d'échange courte et respectueuse a plus de chances d'aboutir." },
    { q: "Avant de financer une certification, il faut :", options: ["Choisir la plus chère", "Vérifier sa reconnaissance par les employeurs et son éligibilité aux dispositifs de financement auprès des sources officielles", "La suivre sans vérifier", "Demander à un forum anonyme"], answer: 1, explain: "Coût, reconnaissance et financement se vérifient auprès des organismes et services officiels." }
  ]
},
/* ---------------------------------------------------------------- S4 J4 */
{
  id: "4-4",
  title: "Préparer l'entretien : questions, méthode STAR, mise en situation",
  minutes: 13,
  lesson: `
<h2>Comment se déroule souvent un recrutement</h2>
<ol>
<li>Un <strong>échange téléphonique</strong> court (recruteur ou cabinet) : motivation, disponibilité, attentes.</li>
<li>Un <strong>entretien</strong> avec le manager de l'équipe : compétences, connaissances LCB-FT, savoir-être.</li>
<li>Parfois un <strong>test</strong> : questionnaire de connaissances, analyse d'un dossier, rédaction d'une note.</li>
<li>Parfois un entretien avec les ressources humaines ou la conformité.</li>
</ol>
<p>Les étapes varient selon les employeurs, mais la préparation est la même.</p>

<h2>Les questions fréquentes</h2>
<table><thead><tr><th>Catégorie</th><th>Exemples</th></tr></thead><tbody>
<tr><td>Motivation</td><td>Présentez-vous. Pourquoi cette reconversion ? Pourquoi notre établissement ?</td></tr>
<tr><td>Connaissances</td><td>Qu'est-ce que le KYC ? Les étapes du blanchiment ? Qu'est-ce qu'un bénéficiaire effectif, une PPE ? Quel est le rôle de Tracfin ?</td></tr>
<tr><td>Mise en situation</td><td>Un client refuse de justifier ses fonds, que faites-vous ? Vous recevez une alerte sanctions sur un homonyme ?</td></tr>
<tr><td>Savoir-être</td><td>Comment gérez-vous le volume et les délais ? Une erreur que vous avez commise ? Comment travaillez-vous en équipe ?</td></tr>
<tr><td>Pratique</td><td>Disponibilité, mobilité, télétravail, prétentions salariales.</td></tr>
</tbody></table>
<span class="verify">pour les prétentions salariales, renseigne-toi sur les rémunérations pratiquées pour ce type de poste et ta région à partir de sources fiables et à jour ; je ne donne volontairement aucun montant.</span>

<h2>La méthode STAR</h2>
<p>Pour les questions « racontez-moi une situation où… », la méthode <strong>STAR</strong> permet une réponse claire en une à deux minutes :</p>
<table><thead><tr><th>Lettre</th><th>Contenu</th></tr></thead><tbody>
<tr><td><strong>S</strong>ituation</td><td>Le contexte, en une phrase.</td></tr>
<tr><td><strong>T</strong>âche</td><td>Ce que tu devais faire.</td></tr>
<tr><td><strong>A</strong>ction</td><td>Ce que <strong>tu</strong> as fait concrètement (le cœur de la réponse).</td></tr>
<tr><td><strong>R</strong>ésultat</td><td>Le résultat, et ce que tu en as retenu.</td></tr>
</tbody></table>
<div class="callout ex"><p><strong>Exemple (situation fictive, à adapter à ton vécu) :</strong> « <strong>S</strong> : lors de l'instruction d'une demande d'aide, j'ai constaté que les ressources déclarées ne correspondaient pas aux relevés fournis. <strong>T</strong> : je devais statuer sur la recevabilité du dossier. <strong>A</strong> : j'ai listé les écarts, demandé des pièces complémentaires de façon neutre, puis rédigé une note factuelle pour la commission. <strong>R</strong> : la décision a pu être prise sur des éléments vérifiés ; j'en retiens l'importance de distinguer ce qui est déclaré de ce qui est justifié, exactement comme en KYC. »</p></div>
<p>Prépare <strong>3 ou 4 histoires STAR</strong> tirées de ton parcours (rigueur, incohérence repérée, gestion de la charge, confidentialité). Elles serviront pour de nombreuses questions.</p>

<h2>La mise en situation sur dossier</h2>
<p>On peut te donner un dossier fictif et te demander ta décision. Applique la méthode des études de cas de cette école :</p>
<ol>
<li><strong>Lire</strong> tout le dossier avant de conclure.</li>
<li><strong>Lister</strong> les pièces : conformes, manquantes, douteuses.</li>
<li><strong>Repérer</strong> les facteurs de risque (client, produit, canal, pays) et les incohérences.</li>
<li><strong>Décider</strong> : valider, compléter, escalader ou refuser.</li>
<li><strong>Justifier</strong> en quelques phrases factuelles (méthode CFAIC de la semaine 3).</li>
</ol>
<p>Le recruteur évalue surtout ton <strong>raisonnement</strong> : il vaut mieux dire « je ne peux pas valider en l'état, il me manque l'identification du bénéficiaire effectif » qu'une décision rapide mal justifiée. Et si tu ne connais pas une règle précise, dis-le : « je vérifierais dans la procédure interne ».</p>

<li>Quels types de dossiers ou d'alertes traiterais-je au début ?</li>
<li>Comment se passe la formation à la prise de poste ?</li>
<li>Quels outils utilisez-vous ?</li>
<li>Comment est évaluée la qualité du travail ?</li>
</ul>

  { q: "Lequel n'est PAS un rôle de Tracfin ?", options: ["Recevoir les déclarations de soupçon", "Analyser les informations financières", "Juger et condamner les auteurs de blanchiment", "Sensibiliser les professionnels"], answer: 2, explain: "Tracfin est un service de renseignement : il ne juge pas. Les poursuites relèvent de l'autorité judiciaire." },
  { q: "Une alerte de surveillance des opérations est :", options: ["Une preuve de blanchiment", "Un signal qui doit être analysé, puis classé ou escaladé de façon motivée", "Une sanction", "Une déclaration de soupçon"], answer: 1, explain: "Une alerte n'est qu'un point de départ : l'analyste l'examine et motive sa décision." },
  { q: "Lors d'une ouverture de compte à distance, le risque est généralement considéré comme :", options: ["Plus faible qu'en agence", "Pouvant être plus élevé, d'où des mesures de vérification adaptées", "Inexistant", "Identique dans tous les cas"], answer: 1, explain: "L'absence de face-à-face est un facteur de risque pris en compte dans l'approche par les risques ; des vérifications adaptées sont prévues." },
  { q: "Une association dont les flux ne correspondent pas à son objet déclaré doit :", options: ["Être ignorée car elle est à but non lucratif", "Faire l'objet d'une analyse de cohérence et, le cas échéant, d'une remontée", "Être fermée sans analyse", "Être signalée au GAFI"], answer: 1, explain: "Les associations peuvent être détournées ; on vérifie la cohérence entre l'objet déclaré et les flux réels." },
  { q: "Quelles sont les quatre familles de facteurs de risque généralement prises en compte ?", options: ["Âge, sexe, revenu, religion", "Client, produit/service, canal, géographie", "Agence, conseiller, guichet, carte", "Montant, devise, heure, date"], answer: 1, explain: "La classification des risques croise le profil du client, le produit, le canal d'entrée en relation et les pays concernés." },
  { q: "La personne qui ouvre le compte d'une société n'est pas dirigeante. Il faut :", options: ["Accepter sans formalité", "Vérifier son identité et sa délégation de pouvoir", "Demander son avis d'imposition", "Refuser systématiquement"], answer: 1, explain: "Seul un dirigeant ou un délégataire dûment habilité peut agir pour la société." },
  { q: "Un acte de vente notarié pour justifier un virement est un justificatif :", options: ["Peu fiable car fourni par le client", "Fiable car émanant d'un tiers indépendant, s'il concorde avec l'opération", "Inutile", "Interdit"], answer: 1, explain: "Un document notarial est probant s'il concorde (montant, date, noms) avec l'opération." },
  { q: "Sur un passeport, la date d'expiration est antérieure à la date de délivrance. C'est :", options: ["Normal pour un passeport étranger", "Une incohérence majeure, indice possible de falsification", "Sans importance", "Un signe de vigilance simplifiée"], answer: 1, explain: "Une chronologie impossible est un indice classique de document falsifié ou fabriqué." },
  { q: "L'origine du patrimoine d'un client PPE s'examine :", options: ["Jamais", "Dans le cadre des mesures de vigilance renforcée", "Uniquement s'il le propose", "Seulement s'il est français"], answer: 1, explain: "Les mesures renforcées pour les PPE incluent l'examen de l'origine du patrimoine et des fonds." },
  { q: "Une adresse différente entre la facture et les bulletins de salaire doit conduire à :", options: ["Un refus immédiat", "Demander une explication et un justificatif complémentaire, puis noter au dossier", "Ignorer l'écart", "Une déclaration de soupçon automatique"], answer: 1, explain: "Un déménagement récent peut l'expliquer : on lève l'incohérence et on documente." },
  { q: "Qui adopte les régimes de sanctions de l'ONU ?", options: ["Le GAFI", "Le Conseil de sécurité des Nations unies", "Le Conseil de l'UE", "L'OFAC"], answer: 1, explain: "Les sanctions de l'ONU sont décidées par le Conseil de sécurité, puis mises en œuvre dans l'UE par des actes européens." },
  { q: "Une alerte de filtrage dont le nom, l'adresse et le numéro d'immatriculation concordent avec une entité listée est :", options: ["Un faux positif", "Une correspondance avérée : blocage et escalade immédiate", "Sans conséquence", "Une simple homonymie"], answer: 1, explain: "Des identifiants concordants caractérisent une correspondance avérée : l'opération n'est pas exécutée." },
  { q: "Un pays sur la liste grise du GAFI implique :", options: ["Un embargo total", "Un facteur de risque géographique appelant une vigilance adaptée", "L'interdiction d'avoir des clients de ce pays", "Une déclaration de soupçon automatique"], answer: 1, explain: "Risque pays ne veut pas dire sanctions : on adapte la vigilance." },
  { q: "En sources ouvertes, un commentaire anonyme sur un forum est :", options: ["Une preuve suffisante", "Une rumeur, à ne jamais utiliser seule", "Un fait établi", "Une source officielle"], answer: 1, explain: "Les forums et commentaires anonymes ont une fiabilité très faible : au mieux un point de départ à recouper." },
  { q: "Dans une note de justification, « le client a voulu cacher l'origine des fonds » est :", options: ["Une bonne formulation", "Un jugement à remplacer par des faits (« aucun justificatif fourni malgré deux demandes »)", "Obligatoire", "Une conclusion neutre"], answer: 1, explain: "On décrit des faits vérifiables, pas des intentions supposées." },
  { q: "Quel intitulé désigne aussi un poste d'analyste KYC ?", options: ["Chargé(e) de connaissance client", "Conseiller(ère) en patrimoine", "Comptable fournisseurs", "Chargé(e) de recouvrement"], answer: 0, explain: "Le métier porte plusieurs noms : analyste KYC, chargé(e) de connaissance client, analyste LCB-FT, analyste AML…" },
  { q: "En entretien, à la question d'un dossier incomplet, le recruteur attend surtout :", options: ["Une décision immédiate", "Un raisonnement structuré et une décision justifiée", "Le nom du logiciel utilisé", "Une opinion sur le client"], answer: 1, explain: "Lister les pièces, repérer les risques, décider et justifier : c'est le raisonnement qui est évalué." },
  { q: "Dans un CV de reconversion, les notions LCB-FT apprises en formation se présentent :", options: ["Comme une expérience professionnelle", "Dans une rubrique formation / compétences acquises en formation", "Elles ne se mentionnent pas", "Comme un diplôme bancaire"], answer: 1, explain: "On reste honnête : formation et expérience sont distinguées." }
];

/* ===================== RESSOURCES (liens fournis — ne pas en ajouter d'autres) ===================== */
const RESOURCES = [
  { title: "Brochures Tracfin / DGCCRF", url: "https://www.economie.gouv.fr/node/3239182", desc: "Brochures de sensibilisation publiées sur le site du ministère de l'Économie." },
  { title: "Guide Tracfin pour les notaires", url: "https://www.economie.gouv.fr/node/2914952", desc: "Guide destiné aux notaires, utile pour comprendre les signaux d'alerte et la déclaration de soupçon." },
  { title: "Lignes directrices ACPR / Tracfin", url: "https://acpr.banque-france.fr", desc: "Site de l'ACPR : rechercher la rubrique consacrée à la LCB-FT et les lignes directrices (certaines conjointes avec Tracfin)." }
];

</script>
<script>
(function () {
"use strict";
/* ===================== ÉTAT & SAUVEGARDE ===================== */
const KEY = "ecoleKycLcbft.v1";
const THEME_KEY = "ecoleKycLcbft.theme";
const defaults = () => ({ days: {}, weekQuiz: {}, exam: { best: null, last: null, history: [] }, examRun: null,
  exercises: {}, flash: {}, cases: {}, liv: {}, started: new Date().toISOString() });
let S;
function load() {
  try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch (e) { S = defaults(); }
}
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast("⚠️ Sauvegarde impossible dans ce navigateur (mode privé ?)"); } }
}
load();

/* ===================== OUTILS ===================== */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const app = $("#app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl2br = s => esc(s).replace(/\n/g, "<br>");
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2400); }
function debounce(fn, ms) { let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const LETTERS = "ABCDEFGH";
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;

/* ===================== THÈME ===================== */
function systemDark() { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
function currentTheme() { let t = null; try { t = localStorage.getItem(THEME_KEY); } catch (e) {} return t || (systemDark() ? "dark" : "light"); }
function applyTheme() {
  const t = currentTheme();
  document.documentElement.setAttribute("data-theme", t);
  $("#themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
}
function setTheme(t) { try { if (t) localStorage.setItem(THEME_KEY, t); else localStorage.removeItem(THEME_KEY); } catch (e) {} applyTheme(); }
$("#themeBtn").addEventListener("click", () => setTheme(currentTheme() === "dark" ? "light" : "dark"));
if (window.matchMedia) { const mq = window.matchMedia("(prefers-color-scheme: dark)"); const h = () => applyTheme(); mq.addEventListener ? mq.addEventListener("change", h) : mq.addListener && mq.addListener(h); }
applyTheme();

/* ===================== LOGIQUE DE PROGRESSION ===================== */
const ALL_DAYS = [];
COURSE.weeks.forEach(w => w.days.forEach((d, i) => ALL_DAYS.push(Object.assign({ week: w.id, idx: i + 1 }, d))));
const findDay = id => ALL_DAYS.find(d => d.id === id);
const findWeek = id => COURSE.weeks.find(w => w.id === Number(id));
const hasContent = d => !!d.lesson;
const dayDone = d => !!(S.days[d.id] && S.days[d.id].quiz != null);
function dayUnlocked(d) {
  if (!hasContent(d)) return true;
  const contentDays = ALL_DAYS.filter(hasContent);
  const i = contentDays.indexOf(d);
  return i <= 0 || dayDone(contentDays[i - 1]);
}
function weekQuizUnlocked(w) { return w.weekQuiz.length > 0 && w.days.filter(hasContent).every(dayDone); }
function currentDay() { return ALL_DAYS.filter(hasContent).find(d => !dayDone(d)) || ALL_DAYS.find(d => !hasContent(d)) || ALL_DAYS[ALL_DAYS.length - 1]; }
function progress() {
  const total = ALL_DAYS.length + COURSE.weeks.length + 1;
  let done = ALL_DAYS.filter(dayDone).length;
  done += COURSE.weeks.filter(w => S.weekQuiz[w.id] != null).length;
  if (S.exam.last != null) done++;
  return pct(done, total);
}
function averageScore() {
  const scores = [];
  Object.values(S.days).forEach(d => { if (d.quiz != null) scores.push(d.quiz); });
  Object.values(S.weekQuiz).forEach(v => { if (v != null) scores.push(v); });
  if (S.exam.last != null) scores.push(S.exam.last);
  return scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
}
function dayState(id) { if (!S.days[id]) S.days[id] = {}; return S.days[id]; }

/* ===================== ROUTEUR ===================== */
let cleanup = null;
function route() {
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  const parts = (location.hash || "#/accueil").replace(/^#\/?/, "").split("/");
  const r = parts[0] || "accueil";
  const views = { accueil: viewDashboard, programme: viewProgram, jour: () => viewDay(parts[1], parts[2]), "quiz-semaine": () => viewWeekQuiz(parts[1]),
    flashcards: viewFlash, cas: () => parts[1] ? viewCase(parts[1]) : viewCases(), examen: viewExam, livrables: viewLivrables, ressources: viewResources, reglages: viewSettings };
  (views[r] || viewDashboard)();
  const navKey = { jour: "programme", "quiz-semaine": "programme" }[r] || r;
  $$(".bottomnav a").forEach(a => a.classList.toggle("active", a.dataset.nav === navKey));
  window.scrollTo(0, 0);
  app.focus({ preventScroll: true });
}
window.addEventListener("hashchange", route);

/* ===================== COMPOSANT QUIZ ===================== */
/* questions: [{q, options, answer, explain}] ; onDone(scorePct) */
function shuffleQuestions(qs) {
  return qs.map(q => { const order = shuffle(q.options.map((_, i) => i)); return { q: q.q, options: order.map(i => q.options[i]), answer: order.indexOf(q.answer), explain: q.explain }; });
}
function renderQuiz(container, originalQuestions, opts) {
  opts = opts || {};
  let questions = shuffleQuestions(originalQuestions);
  const answers = new Array(questions.length).fill(null);
  let submitted = false;
  function draw() {
    container.innerHTML = questions.map((q, i) => `
      <div class="q card" data-q="${i}">
        <div class="q-title">${i + 1}. ${esc(q.q)}</div>
        ${q.options.map((o, j) => {
          let cls = "opt";
          if (submitted) { if (j === q.answer) cls += " good"; else if (answers[i] === j) cls += " bad"; }
          else if (answers[i] === j) cls += " sel";
          return `<button type="button" class="${cls}" data-o="${j}" ${submitted ? "disabled" : ""} aria-pressed="${answers[i] === j}"><span class="l">${LETTERS[j]}</span><span>${esc(o)}</span></button>`;
        }).join("")}
        ${submitted ? `<div class="explain">${answers[i] === q.answer ? "✅ Bonne réponse." : "❌ Réponse attendue : " + LETTERS[q.answer] + "."} ${esc(q.explain)}</div>` : ""}
      </div>`).join("") +
      (submitted ? "" : `<button type="button" class="btn primary block" id="quizSubmit">Valider mes réponses</button>`);
    $$(".opt", container).forEach(b => b.addEventListener("click", () => {
      const qi = Number(b.closest(".q").dataset.q); answers[qi] = Number(b.dataset.o); draw();
    }));
    const sub = $("#quizSubmit", container);
    if (sub) sub.addEventListener("click", () => {
      const missing = answers.filter(a => a === null).length;
      if (missing && !confirm(missing + " question(s) sans réponse. Valider quand même ?")) return;
      submitted = true;
      const good = questions.filter((q, i) => answers[i] === q.answer).length;
      const score = pct(good, questions.length);
      draw();
      const res = document.createElement("div");
      res.className = "card result";
      res.innerHTML = `<b>${good} / ${questions.length}</b><span class="muted">Score : ${score} %</span>
        <div class="btn-row" style="justify-content:center"><button type="button" class="btn" id="quizRetry">Recommencer</button>${opts.nextHref ? `<a class="btn primary" href="${opts.nextHref}">${esc(opts.nextLabel || "Continuer")}</a>` : ""}</div>`;
      container.prepend(res);
      $("#quizRetry", res).addEventListener("click", () => { answers.fill(null); submitted = false; questions = shuffleQuestions(originalQuestions); draw(); container.scrollIntoView(); });
      if (opts.onDone) opts.onDone(score);
      res.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
  draw();
}

/* ===================== TABLEAU DE BORD ===================== */
function viewDashboard() {
  const p = progress(), avg = averageScore(), cd = currentDay();
  const allDone = ALL_DAYS.every(dayDone);
  const w = findWeek(cd.week);
  const flashKnown = FLASHCARDS.filter(f => S.flash[f.term] === "known").length;
  const casesDone = CASES.filter(c => S.cases[c.id] && S.cases[c.id].done).length;
  app.innerHTML = `
    <h1>Bonjour Leila 👋</h1>
    <p class="muted">Ta formation d'analyste KYC / LCB-FT en 4 semaines, à raison d'1 h à 1 h 30 par jour.</p>
    <div class="card">
      <div class="week-head"><strong>Progression globale</strong><span class="badge pri">${p} %</span></div>
      <div class="progress" style="margin-top:8px" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
    </div>
    <div class="grid grid-3">
      <div class="stat"><b>${p}%</b><span>Progression</span></div>
      <div class="stat"><b>${allDone ? "✓" : "S" + cd.week + "·J" + cd.idx}</b><span>${allDone ? "Programme terminé" : "Jour en cours"}</span></div>
      <div class="stat"><b>${avg == null ? "–" : avg + "%"}</b><span>Score moyen</span></div>
    </div>
    ${allDone ? `<div class="card"><span class="badge ok">Programme terminé 🎉</span><h2 style="margin-top:8px">Bravo Leila, les 20 jours sont validés !</h2>
      <p class="muted small">${COURSE.weeks.every(x => S.weekQuiz[x.id] != null) ? "Tous les quiz de fin de semaine sont faits." : "Il te reste des quiz de fin de semaine à passer (voir Programme)."} ${S.exam.last == null ? "Dernière étape : l'examen blanc final." : "Tu peux repasser l'examen blanc pour t'entraîner."}</p>
      <div class="btn-row"><a class="btn primary" href="#/examen">⏱️ Examen blanc</a><a class="btn" href="#/livrables">📝 Exporter mes livrables</a></div></div>` : `<div class="card">
      <span class="badge">Semaine ${w.id} — ${esc(w.title)}</span>
      <h2 style="margin-top:8px">${esc(cd.title)}</h2>
      <p class="muted small">${hasContent(cd) ? "≈ " + cd.minutes + " min de lecture + exercice + quiz de 5 questions" : "Contenu à venir — en attendant, entraîne-toi sur les études de cas et les flashcards."}</p>
      <a class="btn primary block" href="#/jour/${cd.id}">▶ Reprendre</a>
    </div>`}
    <div class="grid grid-2">
      <a class="card tile" href="#/flashcards"><span class="ico">🃏</span><span><b>Flashcards</b><span class="muted small">${flashKnown}/${FLASHCARDS.length} maîtrisées</span></span></a>
      <a class="card tile" href="#/cas"><span class="ico">🗂️</span><span><b>Études de cas</b><span class="muted small">${casesDone}/${CASES.length} traitées</span></span></a>
      <a class="card tile" href="#/examen"><span class="ico">⏱️</span><span><b>Examen blanc</b><span class="muted small">${S.exam.best == null ? "30 questions · 45 min" : "Meilleur : " + S.exam.best + " %"}</span></span></a>
      <a class="card tile" href="#/ressources"><span class="ico">🔗</span><span><b>Ressources</b><span class="muted small">Tracfin, ACPR</span></span></a>
    </div>
    <div class="callout small"><p>💡 Conseil : lis la leçon le matin ou à ta pause, fais l'exercice et le quiz en fin de journée, puis 5 minutes de flashcards. Ta progression est enregistrée dans ce navigateur.</p></div>`;
}

/* ===================== PROGRAMME ===================== */
function viewProgram() {
  const cd = currentDay();
  app.innerHTML = `<h1>Programme</h1><p class="muted">4 semaines · 5 jours par semaine · une leçon, un exercice et un quiz par jour.</p>` +
    COURSE.weeks.map(w => {
      const done = w.days.filter(dayDone).length;
      const wq = S.weekQuiz[w.id];
      return `<section class="week card">
        <div class="week-head"><h2 style="margin:0">Semaine ${w.id} · ${esc(w.title)}</h2><span class="badge ${done === 5 ? "ok" : ""}">${done}/5</span></div>
        <p class="muted small">${esc(w.goal)}<br>📌 Livrable : <a href="#/livrables">${esc(w.deliverable.label)}</a></p>
        ${w.days.map(d => {
          const ok = dayDone(d), un = dayUnlocked(d), cur = d.id === cd.id;
          const cls = "day" + (ok ? " done" : "") + (un ? "" : " locked") + (cur ? " current" : "");
          const badge = !hasContent(d) ? '<span class="badge">À venir</span>' : ok ? `<span class="badge ok">${S.days[d.id].quiz} %</span>` : un ? (cur ? '<span class="badge pri">En cours</span>' : "") : '<span class="badge">🔒</span>';
          const inner = `<span class="num">${ok ? "✓" : d.idx}</span><span class="t"><b>${esc(d.title)}</b><span class="muted small">Jour ${d.idx} · ≈ ${d.minutes} min</span></span>${badge}`;
          return un ? `<a class="${cls}" href="#/jour/${d.id}">${inner}</a>` : `<div class="${cls}" aria-disabled="true" title="Termine le jour précédent pour débloquer">${inner}</div>`;
        }).join("")}
        ${w.weekQuiz.length ? (weekQuizUnlocked(w)
          ? `<a class="day ${wq != null ? "done" : ""}" href="#/quiz-semaine/${w.id}"><span class="num">${wq != null ? "✓" : "★"}</span><span class="t"><b>Quiz de fin de semaine</b><span class="muted small">${w.weekQuiz.length} questions</span></span>${wq != null ? `<span class="badge ok">${wq} %</span>` : ""}</a>`
          : `<div class="day locked"><span class="num">★</span><span class="t"><b>Quiz de fin de semaine</b><span class="muted small">Débloqué après les 5 jours</span></span><span class="badge">🔒</span></div>`)
          : `<div class="day locked"><span class="num">★</span><span class="t"><b>Quiz de fin de semaine</b><span class="muted small">Contenu à venir</span></span></div>`}
      </section>`;
    }).join("") +
    `<a class="card tile" href="#/examen"><span class="ico">⏱️</span><span><b>Examen blanc final</b><span class="muted small">30 questions chronométrées (45 min)</span></span></a>`;
}

/* ===================== ÉCRAN JOUR ===================== */
function viewDay(id, tab) {
  const d = findDay(id);
  if (!d) { location.hash = "#/programme"; return; }
  const w = findWeek(d.week);
  if (!dayUnlocked(d)) {
    app.innerHTML = `<div class="card placeholder"><div class="big">🔒</div><h2>Jour verrouillé</h2><p class="muted">Termine d'abord le quiz du jour précédent.</p><a class="btn primary" href="#/jour/${currentDay().id}">Aller au jour en cours</a></div>`;
    return;
  }
  const head = `<a href="#/programme" class="small">← Programme</a>
    <p class="muted small" style="margin:.6em 0 0">Semaine ${w.id} · Jour ${d.idx} · ≈ ${d.minutes} min</p>
    <h1>${esc(d.title)}</h1>`;
  if (!hasContent(d)) {
    app.innerHTML = head + `<div class="card placeholder"><div class="big">🚧</div><h2>Contenu à venir</h2>
      <p class="muted">La leçon, l'exercice et le quiz de ce jour seront ajoutés prochainement (semaine ${w.id} : ${esc(w.title)}).</p></div>` +
      (d.exercise ? `<div class="card">${d.exercise.prompt}</div>` : "") +

  function draw() {
    const L = list(); if (i >= L.length) i = 0;

        <div class="grid grid-3" style="margin-top:8px"><button type="button" class="btn" id="fPrev" aria-label="Carte précédente">←</button><button type="button" class="btn" id="fShuffle">🔀 Mélanger</button><button type="button" class="btn" id="fNext" aria-label="Carte suivante">→</button></div>`
        : `<div class="card placeholder"><div class="big">🎉</div><p>Aucune carte dans cette catégorie.</p></div>`}
      <div class="callout small"><p>📌 Ces définitions servent de base à ta <a href="#/livrables">fiche de vocabulaire</a> (semaine 1) : reformule-les avec tes mots.</p></div>`;
    $$(".tabs button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; i = 0; flipped = false; draw(); }));
    if (!c) return;
    $("#card").addEventListener("click", () => { flipped = !flipped; $("#card").classList.toggle("flipped", flipped); });
    const mark = v => { S.flash[c.term] = v; save(); flipped = false; if (filter === "all") i = (i + 1) % L.length; draw(); };
    $("#fKnown").addEventListener("click", () => mark("known"));
    $("#fReview").addEventListener("click", () => mark("review"));
    $("#fNext").addEventListener("click", () => { i = (i + 1) % L.length; flipped = false; draw(); });
    $("#fPrev").addEventListener("click", () => { i = (i - 1 + L.length) % L.length; flipped = false; draw(); });
    $("#fShuffle").addEventListener("click", () => { const s = shuffle(FLASHCARDS); FLASHCARDS.length = 0; s.forEach(x => FLASHCARDS.push(x)); i = 0; flipped = false; draw(); });
  }
  draw();
}

/* ===================== EXAMEN BLANC ===================== */
const EXAM_N = 30, EXAM_MIN = 45;
function buildExam() {
  const pool = EXAM_BANK.slice();
  COURSE.weeks.forEach(w => { w.days.forEach(d => (d.quiz || []).forEach(q => pool.push(q))); (w.weekQuiz || []).forEach(q => pool.push(q)); });
  const seen = new Set();
  const uniq = pool.filter(q => !seen.has(q.q) && seen.add(q.q));
  /* priorité à la banque d'examen (couvre les 4 semaines), complétée par les quiz rédigés */
  const bank = shuffle(EXAM_BANK);
  const rest = shuffle(uniq.filter(q => !EXAM_BANK.includes(q)));
  let picked = bank.slice(0, 20).concat(rest.slice(0, 10));
  if (picked.length < EXAM_N) picked = picked.concat(bank.slice(20), rest.slice(10)).slice(0, EXAM_N);
  picked = shuffle(picked);
  return picked.map(q => {
    const order = shuffle(q.options.map((_, i) => i));
    return { q: q.q, options: order.map(i => q.options[i]), answer: order.indexOf(q.answer), explain: q.explain };
  });
}
function viewExam() {
  const run = S.examRun;
  if (!run) {
    app.innerHTML = `<h1>Examen blanc final</h1>
      <div class="card"><p><strong>${EXAM_N} questions</strong> à choix multiples · <strong>${EXAM_MIN} minutes</strong> · tirage aléatoire sur l'ensemble du programme.</p>
      <ul><li>Tu peux naviguer entre les questions et modifier tes réponses.</li><li>À la fin du temps, l'examen est corrigé automatiquement.</li><li>Si tu fermes la page, le chrono continue et tu reprends où tu en étais.</li></ul>
      ${S.exam.best != null ? `<p>Meilleur score : <strong>${S.exam.best} %</strong> · Dernier : <strong>${S.exam.last} %</strong></p>` : ""}
      <button type="button" class="btn primary block" id="examStart">Commencer l'examen</button></div>
      ${S.exam.history.length ? `<div class="card"><h3>Historique</h3><ul>${S.exam.history.slice(-5).reverse().map(h => `<li>${new Date(h.date).toLocaleString("fr-FR")} — ${h.score} %</li>`).join("")}</ul></div>` : ""}`;
    $("#examStart").addEventListener("click", () => { S.examRun = { qs: buildExam(), ans: new Array(EXAM_N).fill(null), start: Date.now(), i: 0, finished: false }; save(); viewExam(); });
    return;
  }
  if (run.finished) return examResult();
  let timer;
  function remaining() { return Math.max(0, run.start + EXAM_MIN * 60000 - Date.now()); }
  function fmt(ms) { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
  function finish() { clearInterval(timer); run.finished = true; save(); examResult(); }
  function tick() { const r = remaining(); const el = $("#examTime"); if (el) { el.textContent = fmt(r); el.parentElement.classList.toggle("low", r < 5 * 60000); } if (r <= 0) { toast("⏱️ Temps écoulé !"); finish(); } }
  function draw() {
    const q = run.qs[run.i], answered = run.ans.filter(a => a !== null).length;
    app.innerHTML = `<div class="timer"><span>⏱️ <span id="examTime">${fmt(remaining())}</span></span><span>Question ${run.i + 1}/${EXAM_N}</span><span class="small muted">${answered} répondues</span></div>
      <div class="progress"><i style="width:${pct(run.i + 1, EXAM_N)}%"></i></div>
      <div class="card q"><div class="q-title">${run.i + 1}. ${esc(q.q)}</div>
        ${q.options.map((o, j) => `<button type="button" class="opt ${run.ans[run.i] === j ? "sel" : ""}" data-o="${j}" aria-pressed="${run.ans[run.i] === j}"><span class="l">${LETTERS[j]}</span><span>${esc(o)}</span></button>`).join("")}
      </div>
      <div class="grid grid-2"><button type="button" class="btn" id="exPrev" ${run.i === 0 ? "disabled" : ""}>← Précédente</button>
        ${run.i < EXAM_N - 1 ? `<button type="button" class="btn primary" id="exNext">Suivante →</button>` : `<button type="button" class="btn ok" id="exEnd">Terminer</button>`}</div>
      <details class="card"><summary>Aller à une question</summary><div class="btn-row">${run.qs.map((_, k) => `<button type="button" class="btn" style="min-width:44px;padding:6px;${run.ans[k] !== null ? "border-color:var(--ok)" : ""}${k === run.i ? ";background:var(--primary-soft)" : ""}" data-go="${k}">${k + 1}</button>`).join("")}</div></details>
      <div class="btn-row"><button type="button" class="btn ok" id="exEnd2">Terminer et corriger</button><button type="button" class="btn danger" id="exAbort">Abandonner</button></div>`;
    $$(".opt").forEach(b => b.addEventListener("click", () => { run.ans[run.i] = Number(b.dataset.o); save(); draw(); }));
    $$("[data-go]").forEach(b => b.addEventListener("click", () => { run.i = Number(b.dataset.go); save(); draw(); }));
    const p = $("#exPrev"), n = $("#exNext");
    if (p) p.addEventListener("click", () => { run.i--; save(); draw(); });
    if (n) n.addEventListener("click", () => { run.i++; save(); draw(); });
    const end = () => { const m = run.ans.filter(a => a === null).length; if (confirm(m ? m + " question(s) sans réponse. Terminer quand même ?" : "Terminer l'examen et voir la correction ?")) finish(); };
    [$("#exEnd"), $("#exEnd2")].forEach(b => b && b.addEventListener("click", end));
    $("#exAbort").addEventListener("click", () => { if (confirm("Abandonner cet examen ? Il ne sera pas noté.")) { clearInterval(timer); S.examRun = null; save(); viewExam(); } });
  }
  draw();
  timer = setInterval(tick, 1000);
  tick();
  cleanup = () => clearInterval(timer);
}
function examResult() {
  const run = S.examRun;
  const good = run.qs.filter((q, i) => run.ans[i] === q.answer).length;
  const score = pct(good, EXAM_N);
  if (!run.scored) {
    run.scored = true; S.exam.last = score; S.exam.best = Math.max(score, S.exam.best || 0);
    S.exam.history.push({ date: new Date().toISOString(), score }); save();
  }
  app.innerHTML = `<h1>Résultat de l'examen blanc</h1>
    <div class="card result"><b>${good} / ${EXAM_N}</b><span class="muted">${score} % · ${score >= 80 ? "Excellent, tu es prête 💪" : score >= 60 ? "Bon niveau, revois les points manqués" : "Continue : relis les leçons et refais les quiz"}</span>
    <div class="btn-row" style="justify-content:center"><button type="button" class="btn primary" id="exNew">Nouvel examen</button><a class="btn" href="#/accueil">Tableau de bord</a></div></div>
    <h2>Correction</h2>` +
    run.qs.map((q, i) => `<div class="card q"><div class="q-title">${i + 1}. ${esc(q.q)}</div>
      ${q.options.map((o, j) => `<div class="opt ${j === q.answer ? "good" : run.ans[i] === j ? "bad" : ""}"><span class="l">${LETTERS[j]}</span><span>${esc(o)}</span></div>`).join("")}
      <div class="explain">${run.ans[i] === q.answer ? "✅" : run.ans[i] === null ? "⬜ Sans réponse." : "❌"} ${esc(q.explain)}</div></div>`).join("");
  $("#exNew").addEventListener("click", () => { S.examRun = null; save(); viewExam(); });
}

    { k: "s4_rep_1", l: "Réponse 1 — Présentez-vous : pourquoi cette reconversion ?" },
    { k: "s4_rep_2", l: "Réponse 2 — Qu'est-ce que le KYC et la LCB-FT, en quelques mots ?" },
    { k: "s4_rep_3", l: "Réponse 3 — Un client refuse de justifier l'origine de ses fonds : que faites-vous ?" },
    { k: "s4_rep_4", l: "Réponse 4 — En quoi votre expérience d'assistante sociale vous servira-t-elle ?" },
    { k: "s4_rep_5", l: "Réponse 5 — Comment gérez-vous un volume important de dossiers et des délais serrés ?" }
  ] }
];
function livText() {
  let out = "MES LIVRABLES — École KYC / LCB-FT\nExport du " + new Date().toLocaleString("fr-FR") + "\n";
  LIV.forEach(s => { out += "\n\n==================== " + s.title.toUpperCase() + " ====================\n"; s.fields.forEach(f => { out += "\n--- " + f.l + " ---\n" + ((S.liv[f.k] || "").trim() || "(vide)") + "\n"; }); });
  return out;
}
function copyText(txt) {
  const fallback = () => { const t = document.createElement("textarea"); t.value = txt; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} t.remove(); toast(ok ? "Copié ✓" : "Copie impossible : utilise le téléchargement."); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => toast("Copié ✓"), fallback); else fallback();
}
function download(name, txt) {
  const blob = new Blob(["\ufeff" + txt], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function viewLivrables() {
  app.innerHTML = `<h1>Mes livrables</h1><p class="muted">Tout est enregistré automatiquement dans ce navigateur. Pense à exporter régulièrement une copie.</p>
    <div class="btn-row"><button type="button" class="btn primary" id="livDl">⬇️ Tout télécharger (.txt)</button><button type="button" class="btn" id="livCopy">📋 Tout copier</button></div>` +
    LIV.map(s => `<section class="card"><h2>${esc(s.title)}</h2>
      ${s.week === 1 ? `<button type="button" class="btn small" id="vocabSeed">➕ Insérer la liste des termes à définir</button>` : ""}
      ${s.fields.map(f => `<label for="liv_${f.k}">${esc(f.l)} ${f.link ? `<a class="small" href="${f.link}">(ouvrir le cas)</a>` : ""}</label>
        <textarea id="liv_${f.k}" data-k="${f.k}" rows="${f.rows || 6}" placeholder="${esc(f.ph || "")}">${esc(S.liv[f.k] || "")}</textarea>`).join("")}
      ${s.week === 4 ? `<p class="muted small">Modèles de réponses : <a href="#/jour/4-5">semaine 4, jour 5</a>. CV : <a href="#/jour/4-2">semaine 4, jour 2</a>.</p>` : ""}
      </section>`).join("");
  $$("textarea[data-k]").forEach(t => t.addEventListener("input", debounce(() => { S.liv[t.dataset.k] = t.value; save(); }, 400)));
  $("#livDl").addEventListener("click", () => download("mes-livrables-kyc-lcbft.txt", livText()));
  $("#livCopy").addEventListener("click", () => copyText(livText()));
  $("#vocabSeed").addEventListener("click", () => {
    const t = $("#liv_s1_vocab");
    t.value = (t.value.trim() + "\n\n" + FLASHCARDS.map(f => f.term + " : ").join("\n")).trim();
    S.liv.s1_vocab = t.value; save(); toast("Termes ajoutés : complète les définitions avec tes mots.");
  });
}

/* ===================== RESSOURCES ===================== */
function viewResources() {
  app.innerHTML = `<h1>Ressources officielles</h1><p class="muted">Seulement des liens officiels vérifiés. Ces documents font foi en cas de doute sur une règle.</p>` +
    RESOURCES.map(r => `<a class="card tile" href="${r.url}" target="_blank" rel="noopener noreferrer"><span class="ico">🔗</span><span><b>${esc(r.title)}</b><span class="muted small">${esc(r.desc)}</span><br><span class="small">${esc(r.url)}</span></span></a>`).join("") +
    `<div class="callout warn"><p>Dans les leçons, les encadrés <strong>⚠️ À vérifier</strong> signalent des points réglementaires (seuils, articles, listes, délais) volontairement non chiffrés : vérifie-les dans les textes officiels et les lignes directrices ACPR / Tracfin.</p></div>
    <p class="muted small">Les liens s'ouvrent dans un nouvel onglet et nécessitent une connexion internet ; le reste de l'école fonctionne hors ligne.</p>`;
}

/* ===================== RÉGLAGES ===================== */
function viewSettings() {
  let stored = null; try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
  app.innerHTML = `<h1>Réglages</h1>
    <div class="card"><h3>Apparence</h3>
      <div class="tabs">${[["", "Automatique (système)"], ["light", "Clair"], ["dark", "Sombre"]].map(([k, l]) => `<button type="button" data-t="${k}" class="${(stored || "") === k ? "active" : ""}">${l}</button>`).join("")}</div></div>
    <div class="card"><h3>Sauvegarde</h3><p class="small muted">Ta progression est enregistrée dans ce navigateur (localStorage), sur cet appareil uniquement. Si tu changes de navigateur ou vides les données du site, elle sera perdue : exporte tes livrables régulièrement.</p>
      <div class="btn-row"><button type="button" class="btn" id="bkDl">⬇️ Sauvegarde complète (.json)</button><label class="btn" style="margin:0;font-weight:600">⬆️ Restaurer<input type="file" id="bkUp" accept=".json,application/json" hidden></label></div></div>
    <div class="card"><h3>Réinitialiser</h3>
      <div class="btn-row"><button type="button" class="btn danger" id="rsProg">Réinitialiser la progression (garder mes livrables)</button>
      <button type="button" class="btn danger" id="rsAll">Tout effacer</button></div></div>
    <p class="muted small">École KYC / LCB-FT · contenu pédagogique indicatif, ne remplace pas les textes officiels.</p>`;
  $$("[data-t]").forEach(b => b.addEventListener("click", () => { setTheme(b.dataset.t || null); viewSettings(); }));
  $("#bkDl").addEventListener("click", () => download("ecole-kyc-sauvegarde.json", JSON.stringify(S, null, 2)));
  $("#bkUp").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const data = JSON.parse(r.result); if (typeof data !== "object" || !data) throw 0; S = Object.assign(defaults(), data); save(); toast("Sauvegarde restaurée ✓"); viewSettings(); } catch (err) { toast("Fichier invalide."); } };
    r.readAsText(f);
  });
  $("#rsProg").addEventListener("click", () => { if (confirm("Réinitialiser la progression (jours, quiz, examen, cartes, cas) ? Tes livrables seront conservés.")) { const liv = S.liv; S = defaults(); S.liv = liv; save(); toast("Progression réinitialisée"); location.hash = "#/accueil"; } });
  $("#rsAll").addEventListener("click", () => { if (confirm("Tout effacer, y compris tes livrables ? Cette action est définitive.")) { S = defaults(); save(); toast("Tout a été effacé"); location.hash = "#/accueil"; } });
}

route();

/* ===================== APPLICATION INSTALLABLE (PWA) =====================
   Le service worker n'est enregistré que si la page est servie en http(s) :
   la version fichier unique (file://) n'est pas concernée. */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}
})();

</script>
